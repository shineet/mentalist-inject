<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Pre-Show — Rules of Engagement</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
    font-family: Georgia, 'Times New Roman', serif;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 0 8vw;
  }
  .line {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 1.1s ease, transform 1.1s ease;
    color: #f5f0e6;
    font-size: clamp(28px, 5vw, 56px);
    font-weight: 400;
    letter-spacing: 0.01em;
    line-height: 1.35;
  }
  .line.sub {
    font-size: clamp(16px, 2.2vw, 24px);
    color: #ffd76a;
    margin-top: 18px;
    font-style: italic;
  }
  .line.gold { color: #ffd76a; }
  .line.show { opacity: 1; transform: translateY(0); }

  /* Hypnotic spiral — concentric rings pulsing outward, like staring down a tunnel */
  #spiralWrap {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding-bottom: 14vh;
    opacity: 0;
    transition: opacity 1.6s ease;
    pointer-events: none;
  }
  #spiralWrap.show { opacity: 1; }
  #spiral {
    width: min(42vw, 42vh);
    height: min(42vw, 42vh);
    border-radius: 50%;
    background: repeating-radial-gradient(
      circle at center,
      #ffd76a 0, #ffd76a 3%,
      #000 3%, #000 9%,
      #b8860c 9%, #b8860c 12%,
      #000 12%, #000 18%
    );
    box-shadow: 0 0 90px 10px rgba(255, 215, 106, 0.18);
    animation: pulse 2.4s ease-in-out infinite alternate;
  }
  @keyframes pulse {
    0%   { background-size: 100% 100%; }
    100% { background-size: 130% 130%; }
  }

  #spiralText {
    position: fixed;
    left: 0; right: 0;
    bottom: 8vh;
    z-index: 2;
    text-align: center;
    padding: 0 8vw;
  }

  /* click-to-start overlay, in case autoplay is blocked or he wants a manual go */
  #startOverlay {
    position: fixed; inset: 0;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    color: #555;
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    z-index: 10;
  }
  #startOverlay.hidden { display: none; }
</style>
</head>
<body>

<div id="startOverlay">Click / press remote to begin</div>

<div id="stage">
  <div id="spiralWrap"><div id="spiral"></div></div>
  <div id="spiralText"></div>
  <div class="line" id="mainLine"></div>
  <div class="line sub" id="subLine"></div>
</div>

<script>
  // ── Rules of Engagement + Hypnotic Wheel pre-show sequence ──────────────
  // Silent by design — Solo Studio on the iPad carries intro music underneath
  // this, same as everything else in the show. Just open this page full-screen
  // (Cmd+Ctrl+F in most browsers) and either click, or wire a remote/Hammerspoon
  // key to click #startOverlay to kick it off on cue.
  //
  // Ends on a hard black screen and stays there — that's the walk-on cue.

  const mainLine = document.getElementById('mainLine');
  const subLine  = document.getElementById('subLine');
  const spiralWrap = document.getElementById('spiralWrap');
  const spiralText  = document.getElementById('spiralText');
  const startOverlay = document.getElementById('startOverlay');

  function setLine(main, sub, gold) {
    mainLine.classList.remove('show');
    subLine.classList.remove('show');
    setTimeout(() => {
      mainLine.textContent = main || '';
      subLine.textContent = sub || '';
      mainLine.classList.toggle('gold', !!gold);
      requestAnimationFrame(() => {
        if (main) mainLine.classList.add('show');
        if (sub) subLine.classList.add('show');
      });
    }, main === null ? 0 : 350);
  }

  function clearLine() {
    mainLine.classList.remove('show');
    subLine.classList.remove('show');
  }

  function setSpiralText(text) {
    spiralText.innerHTML = text
      ? `<div class="line gold show" style="position:relative">${text}</div>`
      : '';
  }

  const seq = [
    { t: 500,   fn: () => setLine('Before Shine takes the stage tonight —') },
    { t: 4200,  fn: () => setLine('there are a few rules.') },
    { t: 8200,  fn: () => setLine('Put your phone away.', "Not because we said so — because you'll want your eyes on this.") },
    { t: 13200, fn: () => setLine('Someone in this room will be chosen tonight.', 'It might be you.') },
    { t: 18200, fn: () => setLine('Whatever you’re about to think —', 'think it clearly. He’s paying attention.') },

    { t: 23200, fn: () => { clearLine(); spiralWrap.classList.add('show'); } },
    { t: 24700, fn: () => setSpiralText('Right now — before anything else happens —') },
    { t: 28700, fn: () => setSpiralText('think of a number between 1 and 50.') },
    { t: 35500, fn: () => setSpiralText('Lock it in.<br><span style="font-size:0.55em;font-style:italic;opacity:.85">Don’t say it out loud. Just remember it.</span>') },
    { t: 40500, fn: () => setSpiralText('Hold on to that thought.<br><span style="font-size:0.55em;font-style:italic;opacity:.85">You’ll understand why, later tonight.</span>') },

    { t: 45500, fn: () => { setSpiralText(''); spiralWrap.classList.remove('show'); } },
    { t: 47000, fn: () => setLine('Tonight, reality gets a little less certain.', null, true) },
    { t: 51500, fn: () => setLine('Please welcome to the stage —', null, true) },
    { t: 55500, fn: () => clearLine() }, // hard black, hold — walk on
  ];

  let timers = [];
  function play() {
    startOverlay.classList.add('hidden');
    timers.forEach(clearTimeout);
    timers = seq.map(step => setTimeout(step.fn, step.t));
  }

  startOverlay.addEventListener('click', play);
  // Also allow spacebar / any key to start, so a Bluetooth remote button (which
  // usually emulates a keypress) can trigger it directly without a click.
  window.addEventListener('keydown', () => { if (!startOverlay.classList.contains('hidden')) play(); });
</script>

</body>
</html>
