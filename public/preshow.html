<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Pre-Show — Rules of Engagement</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
    font-family: Georgia, 'Times New Roman', serif;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 0 8vw;
  }
  .line {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 1.1s ease, transform 1.1s ease;
    color: #f5f0e6;
    font-size: clamp(28px, 5vw, 56px);
    font-weight: 400;
    letter-spacing: 0.01em;
    line-height: 1.35;
  }
  .line.sub {
    font-size: clamp(16px, 2.2vw, 24px);
    color: #ffd76a;
    margin-top: 18px;
    font-style: italic;
  }
  .line.gold { color: #ffd76a; }
  .line.show { opacity: 1; transform: translateY(0); }

  /* Hypnotic spiral — concentric rings pulsing outward, like staring down a tunnel */
  #spiralWrap {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding-bottom: 14vh;
    opacity: 0;
    transition: opacity 1.6s ease;
    pointer-events: none;
  }
  #spiralWrap.show { opacity: 1; }
  #spiral {
    width: min(42vw, 42vh);
    height: min(42vw, 42vh);
    border-radius: 50%;
    background: repeating-radial-gradient(
      circle at center,
      #ffd76a 0, #ffd76a 3%,
      #000 3%, #000 9%,
      #b8860c 9%, #b8860c 12%,
      #000 12%, #000 18%
    );
    box-shadow: 0 0 90px 10px rgba(255, 215, 106, 0.18);
    animation: pulse 2.4s ease-in-out infinite alternate;
  }
  @keyframes pulse {
    0%   { background-size: 100% 100%; }
    100% { background-size: 130% 130%; }
  }

  /* click-to-start overlay, in case autoplay is blocked or he wants a manual go */
  #startOverlay {
    position: fixed; inset: 0;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    color: #555;
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    z-index: 10;
  }
  #startOverlay.hidden { display: none; }
</style>
</head>
<body>

<div id="startOverlay">Click / press remote to begin</div>

<div id="stage">
  <div id="spiralWrap"><div id="spiral"></div></div>
  <div class="line" id="mainLine"></div>
  <div class="line sub" id="subLine"></div>
</div>

<audio id="bgMusic" preload="auto" loop></audio>

<script>
  // ── Rules of Engagement + Hypnotic Wheel pre-show sequence ──────────────
  // Open this page full-screen (Cmd+Ctrl+F in most browsers) and either
  // click, or wire a remote/Hammerspoon key to click #startOverlay to kick
  // it off on cue. Ends on a hard black screen and stays there — that's
  // the walk-on cue.
  //
  // MUSIC: same pattern as the main host panel's Media URLs — paste your
  // own track per-show via a `music` link param instead of hardcoding a
  // file, e.g.:
  //   preshow.html?music=https://your-supabase-url/intro-track.mp3
  // Falls back to /music.mp3 (the generic fallback track already in this
  // repo) if no param is given. Plays through the Mac's audio output —
  // if you're on the Bigfoot 2 cable setup, that means this track comes
  // out over the Line In channel, not Solo Studio's Bluetooth channel, so
  // there's nothing to double up on. Fades out over the last few seconds
  // so it's silent by the time you walk out.

  const mainLine = document.getElementById('mainLine');
  const subLine  = document.getElementById('subLine');
  const spiralWrap = document.getElementById('spiralWrap');
  const startOverlay = document.getElementById('startOverlay');
  const bgMusic = document.getElementById('bgMusic');

  const musicParam = new URLSearchParams(location.search).get('music');
  bgMusic.src = musicParam || '/music.mp3';
  const MUSIC_VOLUME = 0.55;
  bgMusic.volume = MUSIC_VOLUME;

  function setLine(main, sub, gold) {
    mainLine.classList.remove('show');
    subLine.classList.remove('show');
    setTimeout(() => {
      mainLine.textContent = main || '';
      subLine.textContent = sub || '';
      mainLine.classList.toggle('gold', !!gold);
      requestAnimationFrame(() => {
        if (main) mainLine.classList.add('show');
        if (sub) subLine.classList.add('show');
      });
    }, main === null ? 0 : 350);
  }

  function clearLine() {
    mainLine.classList.remove('show');
    subLine.classList.remove('show');
  }

  const seq = [
    { t: 500,   fn: () => setLine("In a few minutes, I'll be out there.") },
    { t: 4200,  fn: () => setLine('I have a few requests.') },
    { t: 7700,  fn: () => setLine('Put your phone away.', "Not because I said so — because you'll want your eyes on this.") },
    { t: 12700, fn: () => setLine('All of you will be part of this show.', 'Not just one of you — everyone in this room.') },
    { t: 17700, fn: () => setLine('No one will be embarrassed.', "Tonight's about wonder, not making anyone look foolish.") },
    { t: 22700, fn: () => setLine('Everything tonight is for entertainment.', "I'm not a psychic. I'm an entertainer.") },
    { t: 27700, fn: () => setLine('Please don’t try to figure things out during the show.', "I know you'll be tempted. But solving it ruins it — for you, and for everyone around you.") },
    { t: 33200, fn: () => setLine('Got questions?', "Find me after the show — I'll be right here.") },
    { t: 37700, fn: () => setLine('Whatever you’re about to think —', "think it clearly. I'm paying attention.") },

    { t: 42700, fn: () => setLine('All of you, please focus.', 'Keep looking at the center of the wheel.') },

    // Hypnotic wheel — silent, just look. No text over it; the ask comes after.
    { t: 47200, fn: () => { clearLine(); spiralWrap.classList.add('show'); } },
    { t: 54200, fn: () => spiralWrap.classList.remove('show') },

    { t: 55800, fn: () => setLine('Think of a number between 1 and 50.', null, true) },
    { t: 59800, fn: () => setLine('Lock it in.', "Don't say it out loud. Just remember it.") },
    { t: 64300, fn: () => setLine('Hold on to that thought.', "You'll understand why, later tonight.") },

    { t: 69800, fn: () => setLine('Tonight, reality gets a little less certain.', null, true) },
    { t: 73300, fn: () => fadeOutMusic(4500) }, // silent by the time you walk out
    { t: 74300, fn: () => setLine('Please welcome to the stage —', null, true) },
    { t: 78300, fn: () => clearLine() }, // hard black, hold — walk on
  ];

  function fadeOutMusic(ms) {
    const steps = 30;
    const stepMs = ms / steps;
    const startVol = bgMusic.volume;
    let i = 0;
    const iv = setInterval(() => {
      i++;
      bgMusic.volume = Math.max(0, startVol * (1 - i / steps));
      if (i >= steps) { clearInterval(iv); bgMusic.pause(); }
    }, stepMs);
  }

  let timers = [];
  function play() {
    startOverlay.classList.add('hidden');
    bgMusic.volume = MUSIC_VOLUME;
    bgMusic.currentTime = 0;
    bgMusic.play().catch(() => {}); // fails silently if music file 404s — sequence still runs
    timers.forEach(clearTimeout);
    timers = seq.map(step => setTimeout(step.fn, step.t));
  }

  startOverlay.addEventListener('click', play);
  // Also allow spacebar / any key to start, so a Bluetooth remote button (which
  // usually emulates a keypress) can trigger it directly without a click.
  window.addEventListener('keydown', () => { if (!startOverlay.classList.contains('hidden')) play(); });
</script>

</body>
</html>
