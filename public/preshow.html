<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Pre-Show — Rules of Engagement</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
    font-family: Georgia, 'Times New Roman', serif;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 0 8vw;
  }
  /* Display-mode sizing — swapped by the setup screen's Projector/Phone toggle */
  :root {
    --main-min: 28px; --main-max: 56px; --main-vw: 5vw;
    --sub-min: 16px;  --sub-max: 24px;  --sub-vw: 2.2vw;
    --wheel-vw: 42vw; --wheel-vh: 42vh;
  }
  body.mode-projector {
    --main-min: 38px; --main-max: 100px; --main-vw: 7.2vw;
    --sub-min: 20px;  --sub-max: 36px;   --sub-vw: 2.9vw;
    --wheel-vw: 48vw; --wheel-vh: 48vh;
  }
  body.mode-phone {
    --main-min: 22px; --main-max: 34px; --main-vw: 6vw;
    --sub-min: 13px;  --sub-max: 18px;  --sub-vw: 3vw;
    --wheel-vw: 55vw; --wheel-vh: 55vh;
  }
  .line {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 1.1s ease, transform 1.1s ease;
    color: #f5f0e6;
    font-size: clamp(var(--main-min), var(--main-vw), var(--main-max));
    font-weight: 400;
    letter-spacing: 0.01em;
    line-height: 1.35;
    white-space: pre-line;
  }
  .line.sub {
    font-size: clamp(var(--sub-min), var(--sub-vw), var(--sub-max));
    color: #ffd76a;
    margin-top: 18px;
    font-style: italic;
  }
  .line.gold { color: #ffd76a; }
  .line.show { opacity: 1; transform: translateY(0); }

  /* Hypnotic spiral — concentric rings pulsing outward, like staring down a tunnel */
  #spiralWrap {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding-bottom: 14vh;
    opacity: 0;
    transition: opacity 1.6s ease;
    pointer-events: none;
  }
  #spiralWrap.show { opacity: 1; }
  #spiral {
    width: min(var(--wheel-vw), var(--wheel-vh));
    height: min(var(--wheel-vw), var(--wheel-vh));
    border-radius: 50%;
    background: repeating-radial-gradient(
      circle at center,
      #ffd76a 0, #ffd76a 3%,
      #000 3%, #000 9%,
      #b8860c 9%, #b8860c 12%,
      #000 12%, #000 18%
    );
    box-shadow: 0 0 90px 10px rgba(255, 215, 106, 0.18);
    animation: pulse 2.4s ease-in-out infinite alternate;
  }
  @keyframes pulse {
    0%   { background-size: 100% 100%; }
    100% { background-size: 130% 130%; }
  }

  /* Setup screen — music URL + display mode, shown before the sequence starts */
  #startOverlay {
    position: fixed; inset: 0;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    cursor: auto;
    z-index: 10;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #startOverlay.hidden { display: none; }
  #setupPanel {
    width: 90%; max-width: 420px;
    text-align: center;
  }
  #setupPanel.hidden { display: none; }
  #setupPanel .setupTitle {
    color: #f5f0e6;
    font-family: Georgia, serif;
    font-size: 22px;
    margin-bottom: 28px;
  }
  #setupPanel label {
    display: block;
    color: #888;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: left;
    margin-bottom: 6px;
  }
  #musicUrl {
    width: 100%;
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    color: #f5f0e6;
    font-size: 14px;
    padding: 11px 12px;
    margin-bottom: 10px;
    outline: none;
  }
  #musicUrl:focus { border-color: #ffd76a; }
  #setupPanel label.checkboxRow {
    display: flex;
    align-items: center;
    gap: 8px;
    text-align: left;
    text-transform: none;
    letter-spacing: normal;
    color: #aaa;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 24px;
  }
  .checkboxRow input[type="checkbox"] {
    width: 16px; height: 16px;
    accent-color: #ffd76a;
    cursor: pointer;
    flex-shrink: 0;
  }
  #modeToggle {
    display: flex; gap: 8px;
    margin-bottom: 28px;
  }
  .modeBtn {
    flex: 1;
    background: #111;
    border: 1px solid #333;
    color: #999;
    border-radius: 8px;
    padding: 12px 8px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .modeBtn.active {
    background: #2a2308;
    border-color: #ffd76a;
    color: #ffd76a;
  }
  #readyStatus {
    font-size: 12px;
    text-align: center;
    margin-bottom: 14px;
    letter-spacing: 0.02em;
  }
  #readyStatus.status-checking { color: #888; }
  #readyStatus.status-ready { color: #7ed17e; }
  #readyStatus.status-error { color: #e0715a; }
  #beginBtn {
    width: 100%;
    background: #ffd76a;
    color: #1a1400;
    border: none;
    border-radius: 8px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.05em;
    cursor: pointer;
    margin-bottom: 14px;
  }
  #setupHint {
    color: #444;
    font-size: 11px;
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>

<div id="startOverlay">
  <div id="setupPanel">
    <div class="setupTitle">Pre-Show Setup</div>

    <label for="musicUrl">Music URL</label>
    <input type="text" id="musicUrl" placeholder="Paste a music URL" autocomplete="off" spellcheck="false" />
    <label class="checkboxRow" for="useDefaultMusic">
      <input type="checkbox" id="useDefaultMusic" />
      <span>Use default track instead</span>
    </label>

    <label>Display</label>
    <div id="modeToggle">
      <button type="button" class="modeBtn active" data-mode="projector">🖥 Projector / Big Screen</button>
      <button type="button" class="modeBtn" data-mode="phone">📱 Phone / Small Screen</button>
    </div>

    <div id="readyStatus" class="status-checking">⏳ Checking track...</div>

    <button id="beginBtn">▶ Begin</button>
    <div id="setupHint">or press any remote/keyboard key to begin</div>
  </div>
</div>

<div id="stage">
  <div id="spiralWrap"><div id="spiral"></div></div>
  <div class="line" id="mainLine"></div>
  <div class="line sub" id="subLine"></div>
</div>

<audio id="bgMusic" preload="auto" loop></audio>
<audio id="announcerVoice" preload="auto" src="/announcer.mp3"></audio>

<script>
  // ── Rules of Engagement + Hypnotic Wheel pre-show sequence ──────────────
  // Open this page full-screen (Cmd+Ctrl+F in most browsers) and either
  // click, or wire a remote/Hammerspoon key to click #startOverlay to kick
  // it off on cue. Ends on a hard black screen and stays there — that's
  // the walk-on cue.
  //
  // MUSIC: same pattern as the main host panel's Media URLs — paste your
  // own track per-show via a `music` link param instead of hardcoding a
  // file, e.g.:
  //   preshow.html?music=https://your-supabase-url/intro-track.mp3
  // Falls back to /music.mp3 (the generic fallback track already in this
  // repo) if no param is given. Plays through the Mac's audio output —
  // if you're on the Bigfoot 2 cable setup, that means this track comes
  // out over the Line In channel, not Solo Studio's Bluetooth channel, so
  // there's nothing to double up on. Fades out over the last few seconds
  // so it's silent by the time you walk out.

  const mainLine = document.getElementById('mainLine');
  const subLine  = document.getElementById('subLine');
  const spiralWrap = document.getElementById('spiralWrap');
  const startOverlay = document.getElementById('startOverlay');
  const setupPanel = document.getElementById('setupPanel');
  const bgMusic = document.getElementById('bgMusic');
  const announcerVoice = document.getElementById('announcerVoice');
  const musicUrlInput = document.getElementById('musicUrl');
  const useDefaultCheckbox = document.getElementById('useDefaultMusic');
  const modeButtons = document.querySelectorAll('.modeBtn');
  const beginBtn = document.getElementById('beginBtn');

  // `?music=` still works as a per-show link override, taking priority over
  // whatever's saved from last time. Otherwise, restore the last URL Shine
  // typed (and whether he had "use default" checked) from localStorage, so
  // he doesn't have to re-paste it every time he loads this page.
  const musicParam = new URLSearchParams(location.search).get('music');
  const savedUrl = localStorage.getItem('preshowMusicUrl') || '';
  if (musicParam) {
    musicUrlInput.value = musicParam;
    useDefaultCheckbox.checked = false;
  } else {
    musicUrlInput.value = savedUrl;
    useDefaultCheckbox.checked = localStorage.getItem('preshowUseDefaultMusic') === 'true' || !savedUrl;
  }

  musicUrlInput.addEventListener('input', () => {
    if (musicUrlInput.value.trim()) {
      useDefaultCheckbox.checked = false;
      localStorage.setItem('preshowUseDefaultMusic', 'false');
    }
    localStorage.setItem('preshowMusicUrl', musicUrlInput.value);
  });
  useDefaultCheckbox.addEventListener('change', () => {
    localStorage.setItem('preshowUseDefaultMusic', useDefaultCheckbox.checked);
    checkReadiness();
  });

  // Setup-screen-only readiness check: this app needs internet to load the
  // page and buffer the music track, but has no offline caching after that.
  // This gives Shine a visual "safe to walk away from WiFi now" signal by
  // fully preloading whichever track is currently selected — separate Audio
  // object, never touches bgMusic or actual playback.
  const readyStatus = document.getElementById('readyStatus');
  const readinessAudio = new Audio();
  readinessAudio.preload = 'auto';
  readinessAudio.addEventListener('canplaythrough', () => {
    readyStatus.textContent = '✅ Ready — fully loaded, safe to go offline';
    readyStatus.className = 'status-ready';
  });
  readinessAudio.addEventListener('error', () => {
    readyStatus.textContent = "⚠️ Couldn't load this track — check the URL";
    readyStatus.className = 'status-error';
  });

  let readinessDebounce;
  function checkReadiness() {
    clearTimeout(readinessDebounce);
    readinessDebounce = setTimeout(() => {
      const url = musicUrlInput.value.trim();
      const src = (useDefaultCheckbox.checked || !url) ? '/music.mp3' : url;
      readyStatus.textContent = '⏳ Checking track...';
      readyStatus.className = 'status-checking';
      readinessAudio.src = src;
      readinessAudio.load();
    }, 500);
  }
  musicUrlInput.addEventListener('input', checkReadiness);
  checkReadiness();

  const MUSIC_VOLUME = 0.55;
  bgMusic.volume = MUSIC_VOLUME;

  let selectedMode = 'projector';
  modeButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      selectedMode = btn.dataset.mode;
      modeButtons.forEach(b => b.classList.toggle('active', b === btn));
    });
  });

  function setLine(main, sub, gold) {
    mainLine.classList.remove('show');
    subLine.classList.remove('show');
    setTimeout(() => {
      mainLine.textContent = main || '';
      subLine.textContent = sub || '';
      mainLine.classList.toggle('gold', !!gold);
      requestAnimationFrame(() => {
        if (main) mainLine.classList.add('show');
        if (sub) subLine.classList.add('show');
      });
    }, main === null ? 0 : 350);
  }

  function clearLine() {
    mainLine.classList.remove('show');
    subLine.classList.remove('show');
  }

  const seq = [
    { t: 500,   fn: () => setLine('In just a few moments...', "We'll experience something extraordinary together.") },
    { t: 5700,  fn: () => setLine("This isn't just my show.") },
    { t: 9200,  fn: () => setLine("It's about all of us.") },
    { t: 13200, fn: () => setLine('Everyone in this room will be part of the experience.') },
    { t: 18200, fn: () => setLine('No one will be embarrassed.', "That's my promise.") },
    { t: 23200, fn: () => setLine("I'm not a psychic.", "I'm here to entertain, amaze, and create impossible moments.") },
    { t: 27600, fn: () => setLine('One important thing.') },
    { t: 30600, fn: () => setLine("Please don't try to figure things out.", 'It will ruin the effect for you and for others.') },
    { t: 35200, fn: () => setLine('Questions?', "Come find me after the show. I'd love to meet you.") },
    { t: 39700, fn: () => setLine('Focus on the center of the screen.', 'Keep your eyes on the wheel.') },

    // Hypnotic wheel — silent, just look. No text over it; the ask comes after.
    { t: 44200, fn: () => { clearLine(); spiralWrap.classList.add('show'); } },
    { t: 51200, fn: () => spiralWrap.classList.remove('show') },

    { t: 52800, fn: () => setLine('Think of a number', 'Between 10 and 50.', true) },
    { t: 56800, fn: () => setLine('Lock it in.', "Don't say it out loud.") },
    { t: 61300, fn: () => setLine('Remember it.', null, true) },

    // Closing line — music plays under it and only fades in the last ~3s,
    // finishing right as the screen cuts to black.
    { t: 65300, fn: () => setLine('The show has already begun.', 'Remember your number.', true) },
    { t: 70800, fn: () => fadeOutMusic(3000) },
    { t: 73800, fn: () => clearLine() }, // hard black — music has fully finished its own ending here

    // Walk-on announcement — plays alone in the dark, after a brief pause,
    // once the music's own ending has fully played out and gone silent.
    // Also hands off from the timed sequence to click-through message mode
    // (see MESSAGES below) -- from here on, clicking/pressing a key steps
    // through the messages instead of doing nothing.
    { t: 74100, fn: () => {
        announcerVoice.volume = 1;
        announcerVoice.play().catch(() => {});
        state = 'messages';
        msgIndex = 0;
      }
    },
  ];

  // ── Click-through messages, appended after the timed pre-show sequence ──
  // Stays on a hard black screen once the sequence above finishes; clicking
  // (or any key) then reveals these one at a time, each alone on screen with
  // a blank black screen in between -- same pattern as the standalone
  // click-messages.html, just folded into the end of this file so there's
  // only one page to open. To reuse with different messages, edit this array.
  const MESSAGES = [
    'Power of\nINFLUENCE',
    'Say “NOT TODAY”\nto\nFailure',
    '"Empathy"',
    'Two heads\nare\nbetter\nthan One',
    'Time\nis\nNOW',
  ];
  const MSG_STATES = [''];
  for (const m of MESSAGES) { MSG_STATES.push(m); MSG_STATES.push(''); }
  let msgIndex = 0;

  function renderMessage() {
    setLine(MSG_STATES[msgIndex] || null, null, true);
  }
  function nextMessage() {
    if (msgIndex >= MSG_STATES.length - 1) return;
    msgIndex++;
    renderMessage();
  }
  function prevMessage() {
    if (msgIndex <= 0) return;
    msgIndex--;
    renderMessage();
  }

  function fadeOutMusic(ms) {
    const steps = 30;
    const stepMs = ms / steps;
    const startVol = bgMusic.volume;
    let i = 0;
    const iv = setInterval(() => {
      i++;
      bgMusic.volume = Math.max(0, startVol * (1 - i / steps));
      if (i >= steps) { clearInterval(iv); bgMusic.pause(); }
    }, stepMs);
  }

  // Two-step flow: Begin only ARMS the show — it locks in the music/mode
  // choices and drops to a blank black screen, so the audience never sees
  // the config panel. The actual timed sequence only starts on the NEXT
  // trigger (remote press, Enter, or a click), whenever Shine is ready to
  // walk out and actually project it.
  let timers = [];
  let state = 'setup'; // 'setup' -> 'armed' -> 'running' -> 'messages'

  function arm() {
    if (state !== 'setup') return;
    state = 'armed';

    document.body.classList.add('mode-' + selectedMode);
    const url = musicUrlInput.value.trim();
    bgMusic.src = (!useDefaultCheckbox.checked && url) ? url : '/music.mp3';

    setupPanel.classList.add('hidden');
    startOverlay.style.cursor = 'none';
  }

  function startSequence() {
    if (state !== 'armed') return;
    state = 'running';

    startOverlay.classList.add('hidden');
    bgMusic.volume = MUSIC_VOLUME;
    bgMusic.currentTime = 0;
    bgMusic.play().catch(() => {}); // fails silently if music file 404s — sequence still runs
    timers.forEach(clearTimeout);
    timers = seq.map(step => setTimeout(step.fn, step.t));
  }

  beginBtn.addEventListener('click', (e) => {
    e.stopPropagation(); // don't let this click bubble up to startOverlay and immediately start too
    arm();
  });

  // Enter inside the music URL field also arms — typing there shouldn't
  // otherwise trigger anything, so plain keydown is ignored while it's focused.
  musicUrlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') arm();
  });

  // Any key (a Bluetooth remote button usually emulates a keypress) either
  // arms the show, actually starts it once armed, or — once the timed
  // sequence has finished — steps through the click-through messages.
  // Not while the user is actively typing a URL into the field.
  window.addEventListener('keydown', (e) => {
    if (document.activeElement === musicUrlInput) return;
    if (document.activeElement === useDefaultCheckbox) return; // don't arm while toggling the checkbox via keyboard
    if (state === 'setup') arm();
    else if (state === 'armed') startSequence();
    else if (state === 'messages') {
      if (e.key === 'ArrowLeft' || e.key === 'Backspace') { e.preventDefault(); prevMessage(); }
      else nextMessage();
    }
  });

  // A click also starts it once armed (blank screen has no visible button).
  startOverlay.addEventListener('click', () => {
    if (state === 'armed') startSequence();
  });

  // Once in message mode, a click anywhere advances to the next message
  // (startOverlay is display:none by then, so this is a separate listener).
  document.addEventListener('click', () => {
    if (state === 'messages') nextMessage();
  });
</script>

</body>
</html>
