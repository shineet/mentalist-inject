<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Audience</title>

  <!-- Genuine full screen, with no browser chrome at all, is only reachable on
       iOS by launching from the Home Screen. iPhone Safari does not implement
       the Fullscreen API, so there is no button a page can offer that hides the
       URL bar; these tags are the whole of what is possible.
       Once added to the Home Screen, the icon opens the page with no toolbars.
       black-translucent puts the field under the status bar as well, which is
       what viewport-fit=cover above is already set up for.
       These only take effect for a Home Screen launch -- they change nothing
       about how the page behaves in normal Safari, so they are safe for the
       audience, who will never install anything. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Show" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#05050b" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <style>
    :root{color-scheme:dark;--bg:#05050b;--text:#fff;--muted:#cfcfe8;--accent:#7c5cff}
    *{box-sizing:border-box} html,body{width:100%;height:100%;margin:0;overflow:hidden}
    /* Overscroll would show the page background behind the field while a
       spectator scrolls to collapse Safari's toolbars. */
    html.fieldFullScreen{overscroll-behavior:none;background:#05050b}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at top,#24244f,#05050b 58%);color:var(--text)}
    .view{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:clamp(18px,4vw,56px)}
    .hidden{display:none!important}
    .idleWrap{display:grid;place-items:center;gap:18px}.heart{font-size:min(34vw,190px);filter:drop-shadow(0 0 28px rgba(255,0,85,.55));animation:beat 1.05s infinite}.idleText{font-size:clamp(22px,5vw,48px);font-weight:800}.hint{font-size:clamp(14px,2.5vw,22px);color:var(--muted)}
    @keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.12)}24%{transform:scale(1)}36%{transform:scale(1.09)}50%{transform:scale(1)}}
    .soundBox{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;background:rgba(0,0,0,.48);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:9px 10px;display:flex;gap:8px;align-items:center;backdrop-filter:blur(10px)}
    .soundBox button,.reviewBtn,.fallbackBtn{border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:800;padding:12px 16px;font-size:16px}.soundBox span{color:#fff;font-size:13px;padding-left:6px}
    #viewLogo img{max-width:min(78vw,620px);max-height:62vh;object-fit:contain;filter:drop-shadow(0 20px 70px rgba(0,0,0,.45))}
    #viewAnim{background:radial-gradient(circle at center,#201248,#05050b 70%)}.spiral{width:min(82vw,680px);aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(from 0deg,#fff 0deg 12deg,#111 12deg 24deg);mask:radial-gradient(circle,transparent 0 8%,#000 9%);animation:spin 1.1s linear infinite;box-shadow:0 0 90px rgba(124,92,255,.35)}@keyframes spin{to{transform:rotate(360deg)}}
    #fxLayer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}.fx{position:absolute;animation:floatUp var(--dur) linear forwards;opacity:.95}@keyframes floatUp{to{transform:translateY(-150vh) rotate(360deg);opacity:0}}
    #viewReveal{padding:0;background:#000}.revealMedia{width:100vw;height:100vh;border:0;object-fit:contain;background:#000}.fallback{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:20}
    #viewClient{background:radial-gradient(circle at top,#291e5a,#080812 65%)}#clientCard{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);box-shadow:0 24px 90px rgba(0,0,0,.35);border-radius:34px;color:#fff;font-weight:900;letter-spacing:-.035em;text-shadow:0 4px 18px rgba(0,0,0,.4)}#clientImg{max-width:94vw;max-height:72vh;object-fit:contain;border-radius:28px;box-shadow:0 24px 90px rgba(0,0,0,.45)}#clientMsg{position:fixed;left:6vw;right:6vw;bottom:calc(28px + env(safe-area-inset-bottom));font-size:clamp(22px,4.5vw,56px);font-weight:850;text-shadow:0 4px 24px #000;white-space:pre-line}
    #viewSchoolShow{background:radial-gradient(circle at top,#241a4a,#05050b 60%);flex-direction:column}#schoolShowHeading{color:var(--accent);font-weight:900;letter-spacing:-.02em;line-height:1.25;font-size:clamp(26px,6vw,64px);white-space:pre-line;text-shadow:0 4px 24px rgba(0,0,0,.5)}#schoolShowBody{color:var(--text);font-weight:600;line-height:1.6;margin-top:26px;font-size:clamp(16px,3vw,30px);white-space:pre-line;max-width:44em;text-shadow:0 4px 18px rgba(0,0,0,.4)}#schoolShowBody strong{color:var(--accent);font-weight:900}
    #schoolShowHeading,#schoolShowBody{opacity:0;transform:translateY(10px);transition:opacity 700ms ease,transform 700ms ease}#schoolShowHeading.show,#schoolShowBody.show{opacity:1;transform:translateY(0)}
    body.schoolShow-phone #schoolShowHeading{font-size:clamp(20px,7vw,34px)}body.schoolShow-phone #schoolShowBody{font-size:clamp(13px,4vw,19px)}
    #viewReview{background:radial-gradient(circle at top,#1b315b,#05050b 64%);flex-direction:column;gap:18px}#viewReview h1{font-size:clamp(32px,7vw,82px);margin:0}.reviewBtn{font-size:clamp(20px,4vw,42px);padding:18px 28px}.countdown{font-size:clamp(16px,3vw,28px);color:var(--muted)}
    .reviewMsg{font-size:clamp(20px,4.4vw,46px);font-weight:800;line-height:1.25;max-width:90vw;white-space:pre-line;text-shadow:0 4px 20px rgba(0,0,0,.45)}
    .idleLogo{max-width:min(78vw,560px);max-height:54vh;object-fit:contain;background:#fff;border-radius:28px;padding:clamp(20px,5vw,44px);box-shadow:0 18px 60px rgba(0,0,0,.45)}
    .net{display:none}

    #viewKaraoke{padding:0;overflow:hidden;background:#050505;position:fixed;inset:0;}
    #karaokeBg{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(16px);transform:scale(1.08);opacity:.85;}
    #karaokeOverlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.20),rgba(0,0,0,.55));}
    #karaokeContent{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(22px,5vw,60px);gap:14px;}
    .karaokeTitle{font-size:clamp(14px,3vw,26px);font-weight:800;color:rgba(255,255,255,.72);margin-bottom:8px;}
    .karaokeLine{max-width:96vw;white-space:pre-line;text-shadow:0 0 22px rgba(0,0,0,.75);transition:opacity .18s ease, transform .18s ease;}
    .karaokeCurrent{font-size:clamp(38px,10.5vw,112px);line-height:1.02;font-weight:1000;letter-spacing:-.055em;color:#fff;text-shadow:0 0 22px rgba(142,255,36,.52),0 6px 30px rgba(0,0,0,.7);}
    .karaokeCurrent .wordUpcoming{color:rgba(255,255,255,.42);transition:color .12s ease;}
    .karaokeCurrent .wordSung{color:#9cff00;transition:color .12s ease;}
    #karaokeReadyMsg{position:fixed;left:0;right:0;bottom:max(20px, env(safe-area-inset-bottom));text-align:center;z-index:3;pointer-events:none;font-size:clamp(14px,3.6vw,20px);font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.4);text-shadow:0 0 14px rgba(0,0,0,.6);}
    .karaokeDim{font-size:clamp(18px,4.6vw,42px);font-weight:850;color:rgba(255,255,255,.58);min-height:1.2em;}
    .karaokeStatus{font-size:clamp(13px,3vw,22px);font-weight:750;color:rgba(255,255,255,.72);min-height:1.2em;}
    .karaokeStartBtn{border:0;border-radius:999px;background:#9cff00;color:#071100;font-weight:950;font-size:clamp(17px,4vw,26px);padding:16px 24px;box-shadow:0 0 34px rgba(156,255,0,.35);margin-top:10px;}
    .karaokeBars{height:44px;display:flex;gap:7px;align-items:flex-end;justify-content:center;filter:drop-shadow(0 0 14px rgba(156,255,0,.8));}
    .karaokeBars span{display:block;width:7px;border-radius:99px;background:#9cff00;animation:kbar .7s ease-in-out infinite alternate;}
    .karaokeBars span:nth-child(1){height:16px;animation-delay:.0s}.karaokeBars span:nth-child(2){height:30px;animation-delay:.12s}.karaokeBars span:nth-child(3){height:40px;animation-delay:.24s}.karaokeBars span:nth-child(4){height:24px;animation-delay:.36s}
    @keyframes kbar{from{transform:scaleY(.45);opacity:.58}to{transform:scaleY(1);opacity:1}}
  </style>

<style>

  #karaokeScreen .karaoke-bg,

<style>
  /* The shared .view is a centred flex row, which put the instruction beside
     the grid instead of under it. Stack this one. */
  #viewInteractive {
    flex-direction: column;
    justify-content: center;
    padding: 0;
    /* --L is the LONG side of the 3:2 field. Everything below derives from it,
       so there is one number per orientation to reason about.
       99vw/99vh rather than 100: a hair of margin so nothing kisses the bezel
       on a rounded screen.

       dvh, not vh, and this is a real bug fix rather than a preference. On iOS
       Safari `vh` means the height the page WOULD have if the toolbars were
       hidden, so sizing the field in vh made it taller than the part of the
       screen you can actually see and the bottom rows were cropped off. `dvh`
       tracks the currently visible height. The vh line is kept immediately
       above as a fallback for anything that does not understand dvh -- it will
       simply ignore the second declaration. */
    --L: min(99vw, 148vh);
    --L: min(99vw, 148dvh);
    --stageW: var(--L);
    --stageH: calc(var(--L) * 2 / 3);
    --rot: 0deg;
  }

  /* PORTRAIT: show the whole thing turned on its side.
     Two reasons, and the second is the important one.
     1. The field is 3:2 and that cannot change -- round 1 asks for the nearest
        face, so a layout that reflowed differently on a tall phone than on a
        wide projector would have two spectators computing different answers.
        A 3:2 landscape box in a portrait window is a band across the middle.
     2. Rotating the ENTIRE view, emoji and all, makes a phone held upright
        show sideways content, which is the universally understood "turn me".
        Once turned it reads correctly either way: with rotation lock ON the
        viewport stays portrait and this rotation is what makes it upright;
        with lock OFF the viewport becomes landscape and the rule below stops
        applying, which lands in the same place.
     The emoji are NOT counter-rotated any more, precisely so the screen looks
     wrong until the phone is turned. */
  @media (orientation: portrait) {
    #viewInteractive {
      --L: min(148vw, 99vh);
      --L: min(148vw, 99dvh);
      --stageW: calc(var(--L) * 2 / 3);
      --stageH: var(--L);
      --rot: 90deg;
    }
  }

  /* Nothing else on screen while the field is up: no caption (the
     instructions are spoken) and no Sound pill (this routine has no audio). */
  #interactiveSay { display: none; }
  body.fieldFullScreen #soundHint { display: none !important; }

  /* MAKING THE PAGE SCROLLABLE IS WHAT BUYS TRUE FULL SCREEN ON AN IPHONE.
     iPhone Safari in landscape hides both toolbars -- but only for a page it
     considers scrollable. Every other page in this app is deliberately
     unscrollable (html,body overflow:hidden, fixed views), and that is exactly
     what pins Safari's chrome in place and leaves the field boxed in.
     So while the field is up, and only then, the document is given a little
     more height than the screen. Nothing moves when it scrolls: the field is
     position:fixed, so this is purely a signal to Safari.
     This is also why the competitor's page behaves the way it does -- small
     and chrome-bound in portrait, genuinely full screen once turned. */
  html.fieldFullScreen,
  body.fieldFullScreen {
    height: auto;
    overflow-x: hidden;
    overflow-y: auto;
  }
  body.fieldFullScreen { min-height: calc(100dvh + 160px); }

  /* The stage occupies the field's ON-SCREEN footprint, which is the field's
     own box with the sides swapped once it is rotated. A rotated element still
     lays out at its unrotated size, so without this wrapper the flex column
     would reserve the wrong space and the field would hang off the sides. */
  #interactiveStage {
    position: relative;
    width: var(--stageW);
    height: var(--stageH);
    margin: 0 auto;
    flex: 0 0 auto;
  }
  .emojiGrid {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--L);
    aspect-ratio: 3 / 2;
    transform: translate(-50%, -50%) rotate(var(--rot));
  }
  .emojiGrid .cell {
    position: absolute;
    /* left/top are set per item in audience.js as percentages of the box.
       translate(-50%,-50%) centres each item on its point; the tilt is
       cosmetic and never used by any rule. */
    transform: translate(-50%, -50%) rotate(var(--tilt, 0deg));
    /* Tied to the packing distance rather than picked by eye, so density and
       size stay in step: change PACK in interactive-set.js and this follows. */
    font-size: calc(var(--L) * 0.055);
    line-height: 1;
    user-select: none;
    transition: opacity .9s ease, transform .9s ease;
  }
  .emojiGrid .cell.logoCell {
    /* border-box and an absolute padding, both deliberately. A percentage
       padding here resolves against the GRID's width, not the plate's, which
       silently inflated every plate to roughly 500px. */
    box-sizing: border-box;
    width: calc(var(--L) * 0.062);
    height: calc(var(--L) * 0.062);
    padding: calc(var(--L) * 0.0074);
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    border-radius: 22%;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .35);
    /* A plate is wider than an emoji, so neighbouring cells can clip it. An
       emoji half-covered by a logo still reads fine; a logo half-covered by an
       emoji is a problem, because the closing instruction asks the room to
       spot the logos. So the logos win the overlap. */
    z-index: 2;
  }
  .emojiGrid .cell.logoCell img {
    /* Explicit 100%, not max-width. An SVG with only a viewBox and no width or
       height attribute has no intrinsic size, and inside a flex item that can
       resolve to nothing at all -- which is how five blank plates happen.
       object-fit then keeps a wide wordmark and a square glyph both intact. */
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  /* The hairline that separates a white plate from the dark field is only
     needed while the plate is small. Scaled 4.6x at the reveal it becomes a
     fuzzy grey ring around the client's logo, so drop it there. */
  .emojiGrid.revealed .cell.logoCell.target { box-shadow: none; }
  /* The vanish itself is scheduled in audience.js -- see runVanish(). CSS only
     supplies the easing here, because the per-cell timing has to survive this
     view re-rendering once a second, and transition-delay did not. */
  .emojiGrid .cell {
    transition: opacity .8s ease, transform .8s ease;
  }
  .emojiGrid.revealed .cell.target {
    transition: opacity .5s ease, transform 1.1s cubic-bezier(.22, 1, .36, 1);
  }
  @media (prefers-reduced-motion: reduce) {
    .emojiGrid .cell,
    .emojiGrid.revealed .cell.target { transition-duration: .25s; }
  }
  .emojiSay {
    margin: 1.8vh auto 0;
    max-width: min(94vw, 620px);
    text-align: center;
    font-size: min(4.3vw, 21px);
    line-height: 1.35;
    color: #f2f2f5;
    /* Reserved so the field never jumps when the instruction changes length,
       but no bigger than that -- every line here is a line the field loses. */
    min-height: 2.7em;
  }
  .emojiSay.pick { color: #ffd166; }
</style>
</head>
<body>
  <div id="fxLayer"></div>

  <section id="viewIdle" class="view">
    <div class="idleWrap">
      <img id="idleLogo" class="idleLogo hidden" alt="" />
      <div id="idleHeart" class="heart">❤️</div>
      <div class="idleText">Get ready</div>
      <div class="hint">Keep this page open</div>
    </div>
  </section>

  <div id="soundHint" class="soundBox">
    <span>Sound</span><button id="btnEnableSound">Enable Sound</button>
  </div>

  <section id="viewLogo" class="view hidden"><img id="logoImg" alt="Logo" /></section>
  <section id="viewAnim" class="view hidden"><div class="spiral"></div></section>

  <section id="viewReveal" class="view hidden">
    <img id="revealImg" class="revealMedia hidden" alt="Reveal" />
    <iframe id="revealFrame" class="revealMedia hidden" allow="autoplay; fullscreen"></iframe>
  </section>

  <section id="viewClient" class="view hidden">
    <div id="clientCard"></div>
    <img id="clientImg" class="hidden" alt="Client" />
    <div id="clientMsg" class="hidden"></div>
  </section>

  <!-- Interactive emoji routine. The grid never changes size mid-routine:
       items disappearing round by round is exactly what exposes the funnel,
       so there is one vanish and it is the finish. -->
  <section id="viewInteractive" class="view hidden">
    <div id="interactiveStage"><div id="interactiveGrid" class="emojiGrid"></div></div>
    <div id="interactiveSay" class="emojiSay"></div>
  </section>

  <section id="viewSchoolShow" class="view hidden">
    <div id="schoolShowHeading"></div>
    <div id="schoolShowBody"></div>
  </section>



  <section id="viewKaraoke" class="view hidden">
    <div id="karaokeBg"></div>
    <div id="karaokeOverlay"></div>
    <div id="karaokeContent">
      <div id="karaokeTitleEl" class="karaokeTitle"></div>
      <div id="karaokePrev" class="karaokeLine karaokeDim"></div>
      <div id="karaokeCurrent" class="karaokeLine karaokeCurrent">Tap Enable Sound & Start</div>
      <div id="karaokeNext" class="karaokeLine karaokeDim"></div>
      <button id="btnKaraokeStart" class="karaokeStartBtn">Enable Sound & Start</button>
      <div id="karaokeStatus" class="karaokeStatus"></div>
      <div class="karaokeBars"><span></span><span></span><span></span><span></span></div>
    </div>
    <div id="karaokeReadyMsg"></div>
  </section>

  <section id="viewReview" class="view hidden">
    <h1 id="reviewTitle">Thank you!</h1>
    <div id="reviewMsg" class="reviewMsg hidden"></div>
    <button id="btnReview" class="reviewBtn">Leave a Google Review</button>
    <div id="countdown" class="countdown"></div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/interactive-set.js?v=6"></script>
  <script src="/audience.js?v=90"></script>

  <div id="karaokePhotoEnd" class="screen hidden">
    <img id="karaokePhotoEndImg" alt="Client photo" />
    <div id="karaokePhotoEndText">Thank you!</div>
  </div>

</body>
</html>
