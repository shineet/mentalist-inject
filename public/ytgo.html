<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>YouTube</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #fff; color: #0f0f0f;
    font: 14px/1.4 Roboto, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; user-select: none; -webkit-user-select: none; }

  /* top bar */
  #bar { background: #fff; height: 50px; display: flex; align-items: center;
         padding: 0 12px; gap: 20px; }
  #mark { display: flex; align-items: center; gap: 3px; }
  #mark .box { width: 29px; height: 20px; background: #f00; border-radius: 5px;
               display: flex; align-items: center; justify-content: center; }
  #mark .box::after { content: ""; border-left: 8px solid #fff; border-top: 5px solid transparent;
                      border-bottom: 5px solid transparent; margin-left: 2px; }
  #mark span { font-size: 19px; font-weight: 700; letter-spacing: -1.1px; color: #0f0f0f; }
  .sp { flex: 1; }
  #bar svg { width: 23px; height: 23px; fill: #0f0f0f; }

  /* the stage */
  #screen { position: relative; width: 100%; aspect-ratio: 16/9; background: #000;
            display: flex; align-items: center; justify-content: center; overflow: hidden; }
  /* A still photograph reads as a stopped video. A very slow drift does not,
     and at arm's length it is the difference between "playing" and "frozen". */
  #cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
           display: none; animation: drift 24s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: scale(1.06) translate(1%, -1%); }
                     to   { transform: scale(1.14) translate(-1%, 1%); } }
  .ring { width: 44px; height: 44px; border-radius: 50%; border: 3px solid transparent;
          border-top-color: #fff; border-right-color: #fff; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #pp { display: none; position: absolute; width: 56px; height: 56px; border-radius: 50%;
        background: rgba(0,0,0,.45); align-items: center; justify-content: center; z-index: 4; }
  #pp.paused::after { content: ""; border-left: 18px solid #fff; border-top: 11px solid transparent;
                      border-bottom: 11px solid transparent; margin-left: 5px; }
  #pp.playing::after { content: ""; width: 15px; height: 18px;
                       border-left: 5px solid #fff; border-right: 5px solid #fff; }
  #vctl { position: absolute; left: 0; right: 0; bottom: 0; display: none; z-index: 3;
          padding: 0 10px 7px; }
  #vrow { display: flex; align-items: center; gap: 8px; color: #fff; font-size: 11px;
          font-variant-numeric: tabular-nums; }
  #vrow svg { width: 17px; height: 17px; fill: #fff; }
  #seek { height: 3px; background: rgba(255,255,255,.35); border-radius: 2px;
          position: relative; margin: 0 2px 6px; }
  #seek > i { display: block; height: 100%; background: #f00; width: 0; border-radius: 2px; }
  #seek > b { position: absolute; top: 50%; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px;
              border-radius: 50%; background: #f00; left: 0; }

  /* title block */
  #info { padding: 12px 12px 8px; }
  #ttl { font-size: 16px; font-weight: 600; line-height: 1.3; }
  #tags { color: #065fd4; font-size: 14px; margin-top: 2px; }
  #by { color: #606060; font-size: 12px; margin-top: 6px; }

  /* channel row */
  #chan { display: flex; align-items: center; gap: 10px; padding: 8px 12px 12px; }
  #av { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: #ddd; }
  #cn { font-size: 14px; font-weight: 500; }
  #cs { color: #606060; font-size: 12px; }
  #sub { margin-left: auto; background: #0f0f0f; color: #fff; font-size: 13px; font-weight: 500;
         padding: 8px 15px; border-radius: 18px; }

  /* chips */
  #chips { display: flex; gap: 8px; padding: 0 12px 12px; overflow: hidden; }
  .chip { display: flex; align-items: center; gap: 6px; background: #f2f2f2; border-radius: 18px;
          padding: 8px 13px; font-size: 13px; white-space: nowrap; }
  .chip svg { width: 18px; height: 18px; fill: #0f0f0f; }

  /* comments */
  #cmt { margin: 0 12px 14px; background: #f2f2f2; border-radius: 12px; padding: 11px 13px; }
  #cmt h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
  #cmt h3 span { color: #606060; font-weight: 400; margin-left: 5px; }
  #cmt .c { display: flex; gap: 9px; align-items: flex-start; }
  #cmt .pic { width: 24px; height: 24px; border-radius: 50%; flex: 0 0 auto;
              background: linear-gradient(135deg, #8ab, #456); }
  #cmt .txt { font-size: 13px; line-height: 1.35; }

  /* up next */
  .rel { display: flex; gap: 10px; padding: 8px 12px; align-items: flex-start; }
  .th { width: 160px; height: 90px; border-radius: 8px; position: relative; flex: 0 0 auto;
        overflow: hidden; background: linear-gradient(135deg, #2f2f2f, #101010 55%, #3a3a3a); }
  .th img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.8) brightness(.78); }
  .th i { position: absolute; right: 4px; bottom: 4px; background: rgba(0,0,0,.8); color: #fff;
          font-size: 11px; padding: 1px 4px; border-radius: 4px; font-style: normal; }
  .rt { font-size: 14px; line-height: 1.3; font-weight: 500; }
  .rc { color: #606060; font-size: 12px; margin-top: 3px; }

  #tap { position: fixed; inset: 0; z-index: 9; background: rgba(0,0,0,.72);
         display: flex; flex-direction: column; align-items: center; justify-content: center;
         gap: 30px; padding: 0 26px; text-align: center; }
  #tap p { color: #fff; font-size: 30px; font-weight: 700; line-height: 1.25; margin: 0; }
  #tap .circle { width: 150px; height: 150px; border-radius: 50%; background: #fff; }
</style>
</head>
<body>

<video id="awake" src="/awake.mp4" loop muted playsinline
       style="position:fixed;width:2px;height:2px;opacity:.01;pointer-events:none;left:0;top:0"></video>

<div id="bar">
  <div id="mark"><div class="box"></div><span>YouTube</span></div>
  <div class="sp"></div>
  <svg viewBox="0 0 24 24"><path d="M21 3H3a2 2 0 0 0-2 2v3h2V5h18v14h-7v2h7a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zM1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2a5 5 0 0 1 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c5 0 9 4 9 9h2c0-6.08-4.93-11-11-11z"/></svg>
  <svg viewBox="0 0 24 24"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6V11c0-3.07-1.64-5.64-4.5-6.32V4a1.5 1.5 0 0 0-3 0v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
  <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7 14 5 12 5 9.5S7 5 9.5 5 14 7 14 9.5 12 14 9.5 14z"/></svg>
</div>

<div id="screen">
  <img id="cover" alt="">
  <div class="ring" id="ring"></div>
  <div id="pp" class="paused"></div>
  <div id="vctl">
    <div id="seek"><i></i><b></b></div>
    <div id="vrow">
      <span id="tnow">0:00</span><span>/</span><span id="tend">0:30</span>
      <div class="sp"></div>
      <svg viewBox="0 0 24 24"><path d="M10 8v8l6-4-6-4zm11-5H3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z" opacity=".85"/></svg>
      <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </div>
  </div>
</div>

<div id="info">
  <div id="ttl">Loading song&hellip;</div>
  <div id="tags">#music #live #official</div>
  <div id="by">23,565,897 views &nbsp;2 years ago</div>
</div>

<div id="chan">
  <img id="av" alt="">
  <div><div id="cn">Vevo</div><div id="cs">12.4M subscribers</div></div>
  <div id="sub">Subscribe</div>
</div>

<div id="chips">
  <div class="chip"><svg viewBox="0 0 24 24"><path d="M18.77 11h-4.23l1.52-4.94A1.54 1.54 0 0 0 14.59 4c-.4 0-.78.16-1.06.44L7 11v9h10.23a2 2 0 0 0 1.94-1.52l1.76-7A2 2 0 0 0 18.77 11zM3 20h3v-9H3v9z"/></svg><span>40K</span></div>
  <div class="chip"><svg viewBox="0 0 24 24"><path d="M5.23 13h4.23l-1.52 4.94A1.54 1.54 0 0 0 9.41 20c.4 0 .78-.16 1.06-.44L17 13V4H6.77a2 2 0 0 0-1.94 1.52l-1.76 7A2 2 0 0 0 5.23 13zM21 4h-3v9h3V4z"/></svg><span>2K</span></div>
  <div class="chip"><svg viewBox="0 0 24 24"><path d="M14 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/></svg><span>Share</span></div>
  <div class="chip"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg><span>Download</span></div>
  <div class="chip"><svg viewBox="0 0 24 24"><path d="M14 10H2v2h12v-2zm0-4H2v2h12V6zM2 16h8v-2H2v2zm19.5-4.5L23 13l-6.99 7-4.51-4.5L13 14l3.01 3 5.49-5.5z"/></svg><span>Save</span></div>
</div>

<div id="cmt">
  <h3>Comments <span>1.2K</span></h3>
  <div class="c"><div class="pic"></div>
    <div class="txt">Who else is still listening to this in 2026? Absolute classic.</div></div>
</div>

<div id="list"></div>

<div id="tap"><p>Tap here once to stop the display from sleeping.</p><div class="circle"></div></div>

<script>
  // THE PERFORMING PAGE, and it is a SEPARATE DOCUMENT on purpose.
  //
  // Priming opens the YouTube app every time; performing did not, and the
  // difference is that priming navigates INSIDE the tap while performing
  // navigates later. the other product navigates later too and still reaches the app, so
  // the shape of their page is the thing to copy rather than argue with. This
  // reproduces it:
  //
  //   1. the landing page navigates HERE from inside its click handler, so this
  //      document is created by a user-initiated navigation
  //   2. a tap here starts the screen-wake video, exactly as NoSleep does
  //   3. an XHR polls every 800ms -- not a setTimeout chain, not a WebSocket
  //   4. the navigation happens INSIDE that XHR callback, body hidden first,
  //      via top.location.replace, to a plain http watch URL with &t=
  //   5. 3.4 seconds later the phone is sent to Google, so there is nothing
  //      left to scroll back to
  //
  // Every one of those five is theirs. If this still lands in Safari then the
  // difference is not in the page and the hunt moves elsewhere.
  var m = location.pathname.match(/^\/y\/([A-Za-z0-9_-]+)\/go\/?$/);
  var room = (m && m[1]) || "x";
  function $(id) { return document.getElementById(id); }

  var playback = "youtube_auto", startAt = 44, videoId = "", track = null;
  var gone = false, armed = false, revealed = false, song = "";
  var audio = new Audio();
  audio.preload = "auto";

  // Anonymous on purpose: a real-looking related title could contradict whatever
  // song is named, and these fit anything. The thumbnails borrow the album art
  // once it arrives, cropped differently and dimmed, so they read as other
  // videos by the same artist rather than four copies of one picture.
  var RELATED = [["Live in concert", "1.2M views", "3:58"],
                 ["Acoustic session", "840K views", "4:49"],
                 ["Behind the scenes", "402K views", "2:12"],
                 ["Studio takes", "1.1M views", "4:05"]];
  var ARTIST = "";
  function paintList(art) {
    // GUARDED. When this threw on a missing element it aborted the whole script
    // before doPoll() ever ran: the page sat on the tap screen and the song
    // never arrived. Nothing decorative may stop the polling again.
    var el = $("list");
    if (!el) return;
    el.innerHTML = RELATED.map(function (r, i) {
      var pic = art ? '<img src="' + art + '" style="object-position:' +
                      (20 + i * 22) + '% ' + (30 + i * 15) + '%">' : '';
      return '<div class="rel"><div class="th">' + pic + '<i>' + r[2] + '</i></div>' +
             '<div><div class="rt">' + r[0] + '</div><div class="rc">' +
             (ARTIST ? ARTIST + " \u00b7 " : "") + r[1] + '</div></div></div>';
    }).join("");
  }
  paintList("");

  // Theirs listens on window for any click and only enables the wake once.
  window.addEventListener("click", function () {
    if (armed) return;
    armed = true;
    $("tap").style.display = "none";
    try { var a = $("awake"); if (a.paused) a.play(); } catch (e) {}
    if (playback === "audio") {
      // Set ONCE, ever, inside this handler: the permission belongs to the
      // element and is discarded the moment its src changes.
      audio.src = "/api/yt/" + encodeURIComponent(room) + "/stream";
      audio.play();
    }
  }, false);

  function watchURL() {
    var t = Number(startAt) > 0 ? "&t=" + Math.round(startAt) : "";
    // http, not https, and no redirect of ours in the way. Both are theirs.
    return "http://www.youtube.com/watch?v=" + videoId + t;
  }

  function cleanUp() { top.location.replace("https://www.google.com"); }

  // XMLHttpRequest rather than fetch, because jQuery's $.get is an XHR and the
  // call site is the one thing being tested here.
  function doPoll() {
    var x = new XMLHttpRequest();
    x.open("GET", "/api/yt/" + encodeURIComponent(room) + "/state?r=" + Date.now(), true);
    x.onload = function () {
      var s = null;
      try { s = JSON.parse(x.responseText).state; } catch (e) {}
      if (s) {
        if (s.playback) playback = s.playback;
        if (s.startAt !== undefined) startAt = Number(s.startAt);
        if (s.track) track = s.track;
        if (s.mode === "play" && s.videoId && !gone) {
          videoId = s.videoId;
          if (playback === "audio") { reveal(); setTimeout(doPoll, 800); return; }
          // INSIDE the callback. This is the line the whole page exists for.
          gone = true;
          song = watchURL();
          document.body.style.display = "none";
          top.location.replace(song);
          setTimeout(cleanUp, 3400);
          return;
        }
      }
      setTimeout(doPoll, 800);
    };
    x.onerror = function () { setTimeout(doPoll, 800); };
    x.send();
  }
  // Started LAST and wrapped, so nothing above can prevent it. Everything else
  // on this page is decoration; this is the effect.
  try { doPoll(); } catch (e) { setTimeout(doPoll, 800); }

  function fmt(n) {
    n = Math.max(0, Math.floor(n || 0));
    return Math.floor(n / 60) + ":" + String(n % 60).padStart(2, "0");
  }
  // Stable for a given song: the same reveal must not show a different view
  // count if the page is reloaded in front of anyone.
  function seeded(str, lo, hi) {
    var h = 0;
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return lo + (h % (hi - lo));
  }
  function commas(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

  function reveal() {
    if (revealed || !track) return;
    revealed = true;
    ARTIST = track.artist || "Vevo";

    $("ttl").textContent = track.title + (track.artist ? " - " + track.artist : "");
    $("tags").textContent = "#" + ARTIST.toLowerCase().replace(/[^a-z0-9]+/g, "") +
                            " #official #music";
    $("by").textContent = commas(seeded(track.title + ARTIST, 4000000, 900000000)) +
                          " views \u00a0" + seeded(ARTIST, 2, 14) + " years ago";
    $("cn").textContent = ARTIST;
    $("cs").textContent = commas(seeded(ARTIST + "s", 400, 24000)) + "K subscribers";

    if (track.cover) {
      $("cover").src = track.cover;
      $("cover").style.display = "block";
      $("av").src = track.cover;
    }
    paintList(track.cover || "");
    $("ring").style.display = "none";
    $("pp").style.display = "flex";
    $("vctl").style.display = "block";
  }
  $("pp").addEventListener("click", function (e) {
    e.stopPropagation();
    if (!revealed) return;
    if (audio.paused) audio.play(); else audio.pause();
  });
  setInterval(function () {
    if (!revealed) return;
    var d = audio.duration && isFinite(audio.duration) ? audio.duration : 30;
    var pct = Math.min(100, (audio.currentTime / d) * 100);
    $("seek").querySelector("i").style.width = pct + "%";
    $("seek").querySelector("b").style.left = pct + "%";
    $("tnow").textContent = fmt(audio.currentTime);
    $("tend").textContent = fmt(d);
    $("pp").className = audio.paused ? "paused" : "playing";
    // YouTube hides the centre button while it plays and shows it on a tap.
    // A permanent play triangle over a playing song gives it away.
    $("pp").style.opacity = audio.paused ? "1" : "0";
  }, 200);
  $("screen").addEventListener("click", function () {
    if (revealed) $("pp").style.opacity = "1";
  });
</script>
</body>
</html>
