<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YouTube open diagnostic</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100dvh; background:#000; color:#fff; padding:24px;
         font:16px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  h1 { font-size:19px; margin:0 0 4px; }
  p.note { color:#8e8e93; font-size:13px; margin:0 0 18px; }
  .row { display:flex; flex-direction:column; gap:10px; margin-bottom:22px; }
  button { appearance:none; border:0; border-radius:12px; padding:15px 16px;
           font:inherit; font-weight:600; background:#1f1f24; color:#fff; text-align:left; }
  button.primary { background:#0a84ff; }
  .lbl { display:block; font-size:12px; font-weight:400; color:#b7b7bd; margin-top:3px; }
  #count { font-size:44px; font-weight:700; font-variant-numeric:tabular-nums; }
  code { color:#6ea8fe; font-size:12px; word-break:break-all; }
</style>
</head>
<body>

<h1>Which one opens the app?</h1>
<p class="note">
  Served from mindgames.fly.dev, the same origin as the real page. Four ways to
  reach the same video. The one that opens the YouTube app is the one the
  reveal should use.
</p>

<div class="row">
  <button class="primary" id="autoWeb">
    Auto, no tap &rarr; youtube.com/watch
    <span class="lbl">Counts down 5s then navigates by itself. What the real page does.</span>
  </button>
  <button class="primary" id="autoRedirect">
    Auto, no tap &rarr; a 302 from this server
    <span class="lbl">Navigates to a URL here, which redirects to YouTube. A different mechanism from the two above. THE ONE THAT MATTERS.</span>
  </button>
  <button class="primary" id="autoShort">
    Auto, no tap &rarr; youtu.be/
    <span class="lbl">Same, but the short domain. A different universal link, and a different per-site preference.</span>
  </button>
</div>

<div class="row">
  <button id="tapWeb">
    Tap &rarr; youtube.com/watch
    <span class="lbl">A real gesture. If this opens the app and the auto one does not, the rule is about gestures.</span>
  </button>
  <button id="tapShort">
    Tap &rarr; youtu.be/
    <span class="lbl">A real gesture on the short domain.</span>
  </button>
  <button id="anchorWeb">
    A plain link, tapped &rarr; youtube.com/watch
    <span class="lbl">Not JavaScript at all. The most app-friendly case there is; if even this stays in Safari, the phone is set to prefer Safari.</span>
  </button>
</div>

<div id="count"></div>
<p class="note"><code id="target"></code></p>

<script>
  var params = new URLSearchParams(location.search);
  var id = (params.get("v") || "NrgmdOz227I").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 11);
  var web = "https://www.youtube.com/watch?v=" + id;
  var short = "https://youtu.be/" + id;
  document.getElementById("target").textContent = web + "   |   " + short;

  function countdownTo(url) {
    var left = 5;
    var el = document.getElementById("count");
    el.textContent = left;
    var t = setInterval(function () {
      left -= 1;
      el.textContent = left > 0 ? left : "now";
      if (left <= 0) { clearInterval(t); location.href = url; }
    }, 1000);
  }

  // ?auto=redirect|web|short starts the countdown ON LOAD, with no tap
  // anywhere on the page.
  //
  // This is the one thing the diagnostic never tested. Every button above
  // needs a tap to start it, so every result so far was measured on a page
  // that had been touched -- and a touched page has "sticky" user activation
  // for the rest of its life, which may be exactly what the redirect was
  // riding on. The real page is never touched by anybody, and the same
  // redirect lands in Safari there.
  //
  // If ?auto=redirect goes to Safari, that is the whole answer: the redirect
  // needs the page to have been touched once, at any point, by anyone.
  var auto = params.get("auto");
  if (auto) {
    var url = auto === "web" ? web : auto === "short" ? short : ("/yt-go/" + id);
    document.getElementById("count").textContent = "5";
    document.querySelector("h1").textContent = "No tap at all \u2014 " + auto;
    countdownTo(url);
  }

  document.getElementById("autoRedirect").onclick = function () {
    countdownTo("/yt-go/" + id);
  };
  document.getElementById("autoWeb").onclick = function () { countdownTo(web); };
  document.getElementById("autoShort").onclick = function () { countdownTo(short); };
  document.getElementById("tapWeb").onclick = function () { location.href = web; };
  document.getElementById("tapShort").onclick = function () { location.href = short; };

  // A genuine <a href>, built rather than clicked programmatically -- a
  // synthetic click is still JavaScript as far as Safari is concerned.
  var a = document.createElement("a");
  a.href = web;
  a.textContent = "A plain link, tapped → youtube.com/watch";
  a.style.cssText = "display:block;padding:15px 16px;border-radius:12px;background:#1f1f24;color:#fff;font-weight:600;text-decoration:none;";
  var btn = document.getElementById("anchorWeb");
  btn.parentNode.replaceChild(a, btn);
</script>
</body>
</html>
