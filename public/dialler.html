<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<!-- Only takes effect when the page is added to the Home Screen, which is the
     one way iOS Safari will give a web page the whole display. In an ordinary
     Safari tab the address bar cannot be removed by any means. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Phone">
<title>Phone</title>
<style>
  /* Follows the phone's own appearance, exactly like the app does. The real
     Phone app is WHITE on a phone in light mode, and a black page on a
     daylight phone is the loudest tell there is. */
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --label: #000000;
    --secondary: #8e8e93;
    /* iOS 26's keypad is WHITE with a soft shadow, not a flat grey circle.
       Side by side against the real Phone app that was the most obvious
       difference on the screen. */
    --key: #ffffff;
    --keyDown: #e4e4e9;
    --keyShadow: 0 1px 3px rgba(0,0,0,0.13), 0 0 0 0.5px rgba(0,0,0,0.03);
    --tabSel: rgba(120,120,128,0.14);
    --gray5: #e5e5ea;
    --blue: #007aff;
    --green: #34c759;
    --red: #ff3b30;
    --hair: rgba(0,0,0,0.10);
    --material: rgba(249,249,249,0.82);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --label: #ffffff;
      --secondary: #8e8e93;
      --key: #2a2a2c;
      --keyDown: #4a4a4e;
      --keyShadow: 0 1px 3px rgba(0,0,0,0.5);
      --tabSel: rgba(120,120,128,0.30);
      --gray5: #2c2c2e;
      --hair: rgba(255,255,255,0.10);
      --material: rgba(30,30,30,0.80);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--label);
    font: 17px/1.25 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  svg { display: block; fill: currentColor; }

  .screen {
    /* 100dvh, not inset:0. A fixed element pinned to inset:0 in Safari uses the
       LARGE viewport, so it keeps its full height while the toolbars are on
       screen and everything inside sits higher than it looks like it should.
       dvh follows the visible viewport instead. */
    position: fixed; left: 0; right: 0; top: 0; height: 100dvh;
    display: none; flex-direction: column;
  }
  .screen.on { display: flex; }

  /* ── Keypad ─────────────────────────────────────────────────────────── */
  #keypadBody { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
  #readout {
    font-size: 40px; font-weight: 400; min-height: 50px;
    padding: 0 20px; text-align: center;
    display: flex; align-items: center; justify-content: center;
    white-space: nowrap;
  }
  #keys { margin-top: 8px; display: flex; flex-direction: column;
          align-items: center; gap: 16px; }
  .row { display: flex; gap: 28px; }
  .k {
    border-radius: 50%; background: var(--key);
    box-shadow: var(--keyShadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    line-height: 1;
  }
  .k.down { background: var(--keyDown); }
  .k .d { font-weight: 400; }
  .k .l { font-weight: 600; letter-spacing: 1.5px; opacity: 0.85; }

  #callRow { position: relative; display: flex; align-items: center;
             justify-content: center; margin-top: 14px; }
  #callBtn { border-radius: 50%; background: var(--green);
             display: flex; align-items: center; justify-content: center; color: #fff; }
  #del { position: absolute; display: none; align-items: center;
         justify-content: center; opacity: 0.7; }
  #del.on { display: flex; }
  /* The gap under the call button, matching the app's 10%-of-height tail.
     A fixed vh rather than a JS measurement: window.innerHeight is read once at
     load and is wrong the moment Safari's toolbars collapse. */
  /* The gap between the call button and the tab bar. Measured against the real
     Phone app rather than the app's 10%-of-height, which is a different number
     on a web viewport. */
  #keypadBody { padding-bottom: 4.5vh; }

  /* ── Floating capsule tab bar ───────────────────────────────────────── */
  .tabs {
    /* The real capsule sits close to the bottom edge, partly INSIDE the home
       indicator's inset rather than clearing it. Adding the full inset on top
       of a margin pushed it about 75pt too high. */
    margin: 0 16px max(10px, calc(env(safe-area-inset-bottom) - 14px));
    padding: 6px 10px;
    display: flex; align-items: center;
    background: var(--material);
    -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px);
    border: 0.5px solid var(--hair);
    border-radius: 999px;
  }
  /* The selected tab sits in a rounded pill, and the unselected icons are
     filled and dark rather than grey outlines. Both are how the real one
     looks; neither was how this looked. */
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center;
         gap: 2px; color: var(--label);
         padding: 5px 2px 4px; border-radius: 18px; }
  .tab.sel { color: var(--blue); background: var(--tabSel); }
  .tab .lab { color: var(--secondary); }
  .tab.sel .lab { color: var(--blue); }
  .tab .lab { font-size: 10px; }
  .tab .ico { position: relative; }
  .badge {
    position: absolute; left: 16px; top: -9px;
    font-size: 11px; font-weight: 600; color: #fff; background: var(--red);
    border-radius: 999px; padding: 1px 5px; line-height: 1.25;
  }
  /* The search key is a filled circle, not a labelled tab. */
  .searchKey { width: 50px; height: 50px; border-radius: 50%;
               background: var(--key); box-shadow: var(--keyShadow);
               color: var(--label);
               display: flex; align-items: center; justify-content: center; }

  /* ── Calls ──────────────────────────────────────────────────────────── */
  #callsBody { flex: 1; display: flex; flex-direction: column; overflow: hidden;
               padding-top: calc(env(safe-area-inset-top) + 8px); }
  #callsBody h1 { font-size: 34px; font-weight: 700; margin: 8px 0 6px; padding: 0 18px; }
  .rlist { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .r { display: flex; align-items: center; gap: 10px; padding: 11px 18px;
       border-bottom: 0.5px solid var(--hair); }
  .r .n { font-size: 18px; }
  .r .sub { font-size: 13px; color: var(--secondary); margin-top: 2px; }
  .r .t { margin-left: auto; font-size: 15px; color: var(--secondary); }
  .r .i { color: var(--blue); }
  .none { flex: 1; display: flex; align-items: center; justify-content: center;
          color: var(--secondary); }

  /* ── Incoming, and the video that follows ───────────────────────────── */
  /* An incoming FaceTime, as closely as a page can draw it: the big avatar
     circle first -- a grey person glyph, which is what iOS shows for a number
     that is in nobody's contacts, and that is exactly the case for a number
     the spectator just invented. Without it the screen jumped from the status
     bar straight to a bare number, which is the thing that read as wrong. */
  #incoming { background: radial-gradient(120% 90% at 50% 0%, #4a4a4e 0%, #262628 55%, #131315 100%);
              color: #fff; align-items: center; }
  /* The self-view that fills a real incoming FaceTime. Mirrored, because that
     is how a front camera is always shown. The avatar below is the fallback
     for a phone that refuses the camera. */
  #inSelf { position: absolute; inset: 0; display: none; }
  #inSelf.on { display: block; }
  #inSelf video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  /* With live video behind it the text needs a scrim, or it disappears against
     a bright room. */
  #incoming.hasCam #inAvatar { display: none; }
  #incoming.hasCam #inNum,
  #incoming.hasCam #inKind { position: relative; text-shadow: 0 1px 8px rgba(0,0,0,0.55); }
  #incoming.hasCam #inNum { padding-top: calc(env(safe-area-inset-top) + 8vh); }
  #incoming.hasCam .answerRow { position: relative; }
  #inAvatar { width: 116px; height: 116px; border-radius: 50%;
              background: rgba(255,255,255,0.20);
              display: flex; align-items: center; justify-content: center;
              margin: 15vh auto 0; color: rgba(255,255,255,0.92); }
  #inAvatar svg { width: 76px; height: 76px; }
  #inNum { font-size: 32px; font-weight: 400; text-align: center;
           padding: 20px 20px 0; white-space: nowrap; letter-spacing: 0.2px; }
  #inKind { font-size: 17px; color: rgba(255,255,255,0.72); text-align: center; padding-top: 6px; }
  /* iOS puts these well apart, low on the screen, with the labels underneath. */
  .answerRow { margin-top: auto; padding: 0 52px calc(env(safe-area-inset-bottom) + 46px);
               display: flex; justify-content: space-between; width: 100%; }
  .answer { display: flex; flex-direction: column; align-items: center; gap: 9px; }
  .answer .circ { width: 80px; height: 80px; border-radius: 50%;
                  display: flex; align-items: center; justify-content: center; color: #fff; }
  .answer.no .circ { background: var(--red); }
  .answer.yes .circ { background: var(--green); animation: nudge 1.4s ease-in-out infinite; }
  @keyframes nudge { 0%,100% { transform: none; } 50% { transform: translateY(-7px); } }
  .answer .lab { font-size: 13px; color: #fff; }

  #video { background: #000; }
  #remoteWrap { position: absolute; inset: 0; }
  #remoteWrap video { width: 100%; height: 100%; object-fit: cover; }
  #selfWrap { position: absolute; top: calc(env(safe-area-inset-top) + 14px); right: 14px;
              width: 104px; height: 150px; border-radius: 12px; overflow: hidden;
              background: #111; box-shadow: 0 2px 12px rgba(0,0,0,0.4); }
  #selfWrap video { width: 100%; height: 100%; object-fit: cover; }
  /* Mirrored only for a FRONT camera, like every self-view. */
  .mirror video { transform: scaleX(-1); }
  /* Flip front/back, beside the end button, where FaceTime keeps it. */
  #vidFlip { position: absolute; right: 28px;
             bottom: calc(env(safe-area-inset-bottom) + 44px);
             width: 60px; height: 60px; border-radius: 50%;
             background: rgba(255,255,255,0.22); color: #fff;
             display: flex; align-items: center; justify-content: center;
             -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  #vidLabel { position: absolute; left: 0; right: 0;
              top: calc(env(safe-area-inset-top) + 22px);
              text-align: center; color: #fff; font-size: 20px;
              text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
  #vidEnd { position: absolute; left: 50%; transform: translateX(-50%);
            bottom: calc(env(safe-area-inset-bottom) + 42px);
            width: 68px; height: 68px; border-radius: 50%; background: var(--red);
            display: flex; align-items: center; justify-content: center; color: #fff; }

  /* ── In call ────────────────────────────────────────────────────────── */
  /* The dark, full-bleed screens stretch to the REAL bottom rather than to
     100dvh. The keypad needs dvh to sit where the Phone app's does, but a call
     screen that stops at dvh leaves a white strip under it where the page body
     shows through -- which is exactly what it did. top:0 + bottom:0 covers the
     home-indicator area too. */
  #call, #incoming, #video { top: 0; bottom: 0; height: auto; }
  #call { background: linear-gradient(to bottom, #3d3d3d, #1c1c1c); color: #fff; }
  #callNum { font-size: 34px; text-align: center; padding: 70px 20px 0;
             white-space: nowrap; }
  #callState { font-size: 17px; color: rgba(255,255,255,0.9);
               text-align: center; padding-top: 6px; }
  .ctls { margin-top: auto; padding: 0 28px 48px;
          display: flex; flex-direction: column; gap: 30px; }
  .ctlRow { display: flex; justify-content: center; gap: 40px; }
  .ctl { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .ctl .circ { width: 80px; height: 80px; border-radius: 50%;
               background: rgba(255,255,255,0.18); color: #fff;
               display: flex; align-items: center; justify-content: center; }
  .ctl.on .circ { background: #fff; color: #000; }
  .ctl.end .circ { background: var(--red); color: #fff; }
  .ctl .lab { font-size: 13px; color: #fff; }
</style>
</head>
<body>

<!-- ── Keypad ─────────────────────────────────────────────────────────── -->
<div class="screen on" id="keypad">
  <div id="keypadBody">
    <div id="readout"></div>
    <div id="keys"></div>
    <div id="callRow">
      <div id="callBtn"></div>
      <div id="del"></div>
    </div>
  </div>
  <div class="tabs" id="tabsA"></div>
</div>

<!-- ── Calls ──────────────────────────────────────────────────────────── -->
<div class="screen" id="calls">
  <div id="callsBody">
    <h1>Calls</h1>
    <div class="rlist" id="rlist"></div>
  </div>
  <div class="tabs" id="tabsB"></div>
</div>

<!-- ── In call ────────────────────────────────────────────────────────── -->
<div class="screen" id="call">
  <div id="callNum"></div>
  <div id="callState">calling&#8230;</div>
  <div class="ctls">
    <div class="ctlRow">
      <div class="ctl on" id="spkBtn"><div class="circ" data-ic="speaker"></div><div class="lab">speaker</div></div>
      <div class="ctl"><div class="circ" data-ic="video"></div><div class="lab">FaceTime</div></div>
      <div class="ctl" id="muteBtn"><div class="circ" data-ic="micslash"></div><div class="lab">mute</div></div>
    </div>
    <div class="ctlRow">
      <div class="ctl"><div class="circ" data-ic="ellipsis"></div><div class="lab">more</div></div>
      <div class="ctl end" id="endBtn"><div class="circ" data-ic="phonedown"></div><div class="lab">end</div></div>
      <div class="ctl"><div class="circ" data-ic="grid"></div><div class="lab">keypad</div></div>
    </div>
  </div>
</div>

<!-- ── Incoming ───────────────────────────────────────────────────────── -->
<div class="screen" id="incoming">
  <div id="inSelf"></div>
  <div id="inAvatar" data-ic="person"></div>
  <div id="inNum"></div>
  <div id="inKind">FaceTime Video</div>
  <div class="answerRow">
    <div class="answer no" id="declineBtn"><div class="circ" data-ic="phonedown"></div><div class="lab">Decline</div></div>
    <div class="answer yes" id="acceptBtn"><div class="circ" data-ic="video"></div><div class="lab">Accept</div></div>
  </div>
</div>

<!-- ── Video ──────────────────────────────────────────────────────────── -->
<div class="screen" id="video">
  <div id="remoteWrap"></div>
  <div id="selfWrap"></div>
  <div id="vidLabel"></div>
  <div id="vidFlip" data-ic="flip"></div>
  <div id="vidEnd" data-ic="phonedown"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/twilio-video@2/dist/twilio-video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2/dist/twilio.min.js"></script>
<script>
(function () {
  // The Ringer dialler, on the spectator's own phone.
  //
  // Every size, weight and colour here is lifted from PhoneView.swift rather
  // than eyeballed, because "close to the Phone app" and "the Phone app" are
  // different things at arm's length. Key size, letter tracking, the 0.86 call
  // button, the floating capsule tab bar with its four items and the 632 badge
  // -- all of it is the app's own geometry.
  //
  // The two-dial rule is Ringer's, unchanged: the FIRST dial of a number
  // reaches a hosted voicemail, the SAME number again diverts to the assistant.
  // The dialled number is never called; Twilio routes on the mode alone, in
  // api/voice-twiml.js, shared with the app so the two cannot drift apart.
  //
  // CallKit cannot be copied, so the call will not appear in the phone's own
  // Recents. Hence this page keeping its own Calls list: the first place anyone
  // looks for a call they watched being made is the thing they watched it being
  // made on.

  // ── SF Symbol shapes, drawn. Emoji was the first version and was the single
  // most obvious tell on the screen.
  var IC = {
    phone: '<svg viewBox="0 0 24 24" width="W" height="W"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>',
    phonedown: '<svg viewBox="0 0 24 24" width="W" height="W" style="transform:rotate(135deg)"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>',
    del: '<svg viewBox="0 0 24 24" width="W" height="W"><path d="M21 5H9.4c-.6 0-1.1.2-1.5.7L2 12l5.9 6.3c.4.5.9.7 1.5.7H21c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-3.1 9.5-1.4 1.4L14 13.4l-2.5 2.5-1.4-1.4 2.5-2.5-2.5-2.5 1.4-1.4 2.5 2.5 2.5-2.5 1.4 1.4-2.5 2.5 2.5 2.5z"/></svg>',
    clock: '<svg viewBox="0 0 24 24" width="W" height="W"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm.9 10.4-3.3 2a.8.8 0 0 1-1.1-.3.8.8 0 0 1 .3-1.1l2.4-1.4V6.8a.8.8 0 0 1 1.6 0v5.1a.6.6 0 0 1 .1.5z"/></svg>',
    person: '<svg viewBox="0 0 24 24" width="W" height="W"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 4.2a3.1 3.1 0 1 1 0 6.2 3.1 3.1 0 0 1 0-6.2zm0 13.9a7.4 7.4 0 0 1-5.3-2.2c.5-1.9 3-3.2 5.3-3.2s4.8 1.3 5.3 3.2A7.4 7.4 0 0 1 12 20.1z"/></svg>',
    grid: '<svg viewBox="0 0 24 24" width="W" height="W"><circle cx="5" cy="5" r="2.1"/><circle cx="12" cy="5" r="2.1"/><circle cx="19" cy="5" r="2.1"/><circle cx="5" cy="12" r="2.1"/><circle cx="12" cy="12" r="2.1"/><circle cx="19" cy="12" r="2.1"/><circle cx="5" cy="19" r="2.1"/><circle cx="12" cy="19" r="2.1"/><circle cx="19" cy="19" r="2.1"/></svg>',
    search: '<svg viewBox="0 0 24 24" width="W" height="W"><path d="M10.5 3a7.5 7.5 0 1 1 0 15 7.5 7.5 0 0 1 0-15zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11zm10.2 15.3-4.6-4.6 1.4-1.4 4.6 4.6a1 1 0 0 1-1.4 1.4z"/></svg>',
    speaker: '<svg viewBox="0 0 24 24" width="W" height="W"><path d="M11 4.5v15c0 .8-1 1.2-1.6.6L5.6 16.5H3c-.6 0-1-.4-1-1v-7c0-.6.4-1 1-1h2.6l3.8-3.6c.6-.6 1.6-.2 1.6.6zM15.5 8.2a1 1 0 0 1 1.4 0 5.4 5.4 0 0 1 0 7.6 1 1 0 1 1-1.4-1.4 3.4 3.4 0 0 0 0-4.8 1 1 0 0 1 0-1.4zm3.1-3.1a1 1 0 0 1 1.4 0 9.8 9.8 0 0 1 0 13.8 1 1 0 0 1-1.4-1.4 7.8 7.8 0 0 0 0-11 1 1 0 0 1 0-1.4z"/></svg>',
    video: '<svg viewBox="0 0 24 24" width="W" height="W"><path d="M4 5.5h9a2.5 2.5 0 0 1 2.5 2.5v8a2.5 2.5 0 0 1-2.5 2.5H4A2.5 2.5 0 0 1 1.5 16V8A2.5 2.5 0 0 1 4 5.5zM22 7.6v8.8c0 .8-.9 1.3-1.6.8L17 14.7V9.3l3.4-2.5c.7-.5 1.6 0 1.6.8z"/></svg>',
    micslash: '<svg viewBox="0 0 24 24" width="W" height="W"><path d="M15 10.6V5a3 3 0 0 0-5.9-.7L15 10.6zM9 8.9v2.6a3 3 0 0 0 4.3 2.7L9 8.9zM5.7 4.3 4.3 5.7l3.1 3.1v2.7a4.6 4.6 0 0 0 6.9 4l1.4 1.4a6.4 6.4 0 0 1-3.9 1.2V21h-1.6v-2.9A6.5 6.5 0 0 1 5 11.7h1.6a4.9 4.9 0 0 0 .3 1.6L3.9 10.3l-.3.2v1.2a8.4 8.4 0 0 0 .5 2.6l14.2 4.6 1.4-1.4L5.7 4.3zM17.4 11.7H19a6.5 6.5 0 0 1-1.5 3.7l-1.2-1.2a4.9 4.9 0 0 0 1.1-2.5z"/></svg>',
    ellipsis: '<svg viewBox="0 0 24 24" width="W" height="W"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>',
    flip: '<svg viewBox="0 0 24 24" width="W" height="W"><path d="M9.4 3h5.2l1.3 1.8H20a2 2 0 0 1 2 2v11.4a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6.8a2 2 0 0 1 2-2h4.1L9.4 3zm2.6 4.6a5.4 5.4 0 0 0-5.3 4.4l-1.4-1-.9 1.2 3 2.2 2.4-2.8-1.2-1-.9 1a3.9 3.9 0 0 1 6.6-1.9l1.1-1.1A5.4 5.4 0 0 0 12 7.6zm5.7 3.6-2.4 2.8 1.2 1 .9-1a3.9 3.9 0 0 1-6.6 1.9l-1.1 1.1a5.4 5.4 0 0 0 9.1-2.6l1.4 1 .9-1.2-3.4-2z"/></svg>',
    info: '<svg viewBox="0 0 24 24" width="W" height="W"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 4.4a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6zm1.4 11.1h-2.8v-1h.6v-4h-.6v-1h2.2v5h.6z"/></svg>',
  };
  function ic(name, size) { return (IC[name] || "").replace(/W/g, size); }

  // ── The MystIO room, from /d/<room> or ?r=<room>. Same room and channel
  // plant.html uses, so the number arrives as an ordinary routine input.
  var params = new URLSearchParams(location.search);
  var room = params.get("r") || params.get("room") || "";
  if (!room) {
    var m = location.pathname.match(/^\/d(?:\/([A-Za-z0-9_-]+))?\/?$/);
    if (m && m[1]) room = m[1];
  }
  room = room.replace(/[^A-Za-z0-9_-]/g, "").slice(0, 40);

  var SUPABASE_URL = "https://nkhwttlmtidtippylbzs.supabase.co";
  var SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5raHd0dGxtdGlkdGlwcHlsYnpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NjA0NTMsImV4cCI6MjA5NzEzNjQ1M30.sHMxZaG6aNejyKGICGSY9LqLXsZwgA55JIfJlesZ8Bs";

  var client = null, channel = null;
  if (room && window.supabase) {
    try {
      client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
      channel = client.channel("vc-" + room, { config: { broadcast: { ack: false } } });
      channel.subscribe();
    } catch (e) { client = null; channel = null; }
  }

  // Sent on the green button, not per keystroke: MystIO routes everything it
  // receives, so a digit-by-digit feed would fire the routine twelve times.
  function sendToApp(number) {
    if (!number) return;
    var id = Date.now();
    if (channel) {
      try { channel.send({ type: "broadcast", event: "word", payload: { word: number, id: id } }); } catch (e) {}
    }
    if (client) {
      try { client.from("remote_input").insert({ room: room, word: number, msg_id: id }); } catch (e) {}
    }
  }

  // ── Geometry, from PhoneView.swift ────────────────────────────────────
  // Measured against the real Phone app side by side: its keys are slightly
  // smaller than the app's 96 and the rows are further apart.
  var PAD = 28, GAP = 28;
  var KEY = Math.min(88, (window.innerWidth - PAD * 2 - GAP * 2) / 3);

  var ORDER = [["1","2","3"],["4","5","6"],["7","8","9"],["*","0","#"]];
  var LETTERS = { "1": "", "2": "ABC", "3": "DEF", "4": "GHI", "5": "JKL",
                  "6": "MNO", "7": "PQRS", "8": "TUV", "9": "WXYZ",
                  "*": "", "0": "+", "#": "" };

  var keys = document.getElementById("keys");
  ORDER.forEach(function (rowKeys) {
    var row = document.createElement("div");
    row.className = "row";
    rowKeys.forEach(function (k) {
      var el = document.createElement("div");
      el.className = "k";
      el.style.width = KEY + "px";
      el.style.height = KEY + "px";
      var letters = LETTERS[k];
      // The "*" glyph sits high in its line box; bigger and nudged down so it
      // reads centred, exactly the compensation the app makes.
      var size = KEY * (k === "*" ? 0.56 : 0.46);
      var nudge = k === "*" ? KEY * 0.11 : 0;
      el.innerHTML =
        '<div class="d" style="font-size:' + size + 'px;transform:translateY(' + nudge + 'px)">' + k + '</div>' +
        (letters ? '<div class="l" style="font-size:' + (KEY * 0.14) + 'px">' + letters + '</div>' : "");
      el.addEventListener("touchstart", function () { el.classList.add("down"); }, { passive: true });
      ["touchend", "touchcancel"].forEach(function (ev) {
        el.addEventListener(ev, function () { el.classList.remove("down"); });
      });
      el.addEventListener("click", function () { press(k); });
      row.appendChild(el);
    });
    keys.appendChild(row);
  });

  var callBtn = document.getElementById("callBtn");
  callBtn.style.width = (KEY * 0.86) + "px";
  callBtn.style.height = (KEY * 0.86) + "px";
  callBtn.innerHTML = ic("phone", Math.round(KEY * 0.34));

  var del = document.getElementById("del");
  del.style.right = (PAD + GAP / 2) + "px";
  del.style.width = "44px";
  del.style.height = "44px";
  del.innerHTML = ic("del", 26);


  // ── Tab bars ──────────────────────────────────────────────────────────
  function buildTabs(el, sel) {
    el.innerHTML =
      '<div class="tab' + (sel === "calls" ? " sel" : "") + '" data-go="calls">' +
        '<div class="ico">' + ic("clock", 22) + '<span class="badge">632</span></div>' +
        '<div class="lab">Calls</div></div>' +
      '<div class="tab"><div class="ico">' + ic("person", 22) + '</div>' +
        '<div class="lab">Contacts</div></div>' +
      '<div class="tab' + (sel === "keypad" ? " sel" : "") + '" data-go="keypad">' +
        '<div class="ico">' + ic("grid", 22) + '</div>' +
        '<div class="lab">Keypad</div></div>' +
      '<div class="tab" style="flex:0 0 auto"><div class="searchKey">' + ic("search", 20) + '</div></div>';
    el.querySelectorAll("[data-go]").forEach(function (t) {
      t.addEventListener("click", function () { show(t.getAttribute("data-go")); });
    });
  }
  buildTabs(document.getElementById("tabsA"), "keypad");
  buildTabs(document.getElementById("tabsB"), "calls");

  document.querySelectorAll(".circ[data-ic]").forEach(function (c) {
    c.innerHTML = ic(c.getAttribute("data-ic"), 32);
  });
  document.querySelectorAll("#vidEnd[data-ic], #vidFlip[data-ic]").forEach(function (c) {
    c.innerHTML = ic(c.getAttribute("data-ic"), 26);
  });
  document.querySelectorAll("#inAvatar[data-ic]").forEach(function (c) {
    c.innerHTML = ic(c.getAttribute("data-ic"), 76);
  });

  // ── Number ────────────────────────────────────────────────────────────
  var digits = "";
  var readout = document.getElementById("readout");

  // Ringer's formatNumber, character for character.
  function fmt(s) {
    var d = String(s).replace(/[^0-9]/g, "");
    if (d.length === 10) return "(" + d.slice(0, 3) + ") " + d.slice(3, 6) + "-" + d.slice(6);
    if (d.length === 11 && d[0] === "1") {
      var r = d.slice(1);
      return "+1 (" + r.slice(0, 3) + ") " + r.slice(3, 6) + "-" + r.slice(6);
    }
    return s;
  }

  function paint() {
    readout.textContent = fmt(digits);
    // The app shows the green button always and the delete key only once there
    // is something to delete.
    del.classList.toggle("on", digits.length > 0);
    // Shrink a long number rather than let it wrap, same as lineLimit(1) with
    // minimumScaleFactor.
    var base = 40;
    var over = Math.max(0, readout.scrollWidth - (window.innerWidth - 40));
    readout.style.fontSize = (over > 0 ? Math.max(20, base - over / 6) : base) + "px";
  }

  function press(ch) {
    if (digits.length >= 18) return;
    digits += ch;
    paint();
  }

  del.addEventListener("click", function () { digits = digits.slice(0, -1); paint(); });
  var hold = null;
  del.addEventListener("touchstart", function () {
    hold = setTimeout(function () { digits = ""; paint(); }, 600);
  }, { passive: true });
  ["touchend", "touchcancel"].forEach(function (ev) {
    del.addEventListener(ev, function () { clearTimeout(hold); });
  });

  // ── Screens ───────────────────────────────────────────────────────────
  var DARK = { call: "#1c1c1c", incoming: "#1c1c1c", video: "#000" };
  function show(id) {
    ["keypad", "calls", "call", "incoming", "video"].forEach(function (s) {
      document.getElementById(s).classList.toggle("on", s === id);
    });
    // Belt and braces for the same white strip: whatever the screen does not
    // cover shows the body, so the body matches it.
    document.body.style.background = DARK[id] || "";
  }

  // ── Calls list ────────────────────────────────────────────────────────
  var recents = [];
  try { recents = JSON.parse(sessionStorage.getItem("r") || "[]"); } catch (e) {}

  function clockOf(ts) {
    var d = new Date(ts), h = d.getHours(), mi = d.getMinutes();
    var ap = h >= 12 ? "PM" : "AM";
    h = h % 12; if (h === 0) h = 12;
    return h + ":" + (mi < 10 ? "0" : "") + mi + " " + ap;
  }

  function paintCalls() {
    var list = document.getElementById("rlist");
    if (!recents.length) {
      list.innerHTML = '<div class="none">No Recent Calls</div>';
      return;
    }
    list.innerHTML = recents.map(function (r) {
      return '<div class="r"><div><div class="n">' + fmt(r.n) + '</div>'
        + '<div class="sub">mobile</div></div>'
        + '<div class="t">' + clockOf(r.t) + '</div>'
        + '<div class="i">' + ic("info", 21) + '</div></div>';
    }).join("");
  }
  paintCalls();

  function addRecent(number) {
    recents.unshift({ n: number, t: Date.now() });
    recents = recents.slice(0, 40);
    try { sessionStorage.setItem("r", JSON.stringify(recents)); } catch (e) {}
    paintCalls();
  }

  // ── The two-dial rule ─────────────────────────────────────────────────
  //
  // ALTERNATES GLOBALLY, and the number does not come into it. Dial any
  // number: voicemail. Dial any other number: divert. That is what
  // CallManager.dial does -- one `awaitingDivert` flag flipped on every dial.
  //
  // This page first shipped keyed by the number, requiring the SAME one twice,
  // because a stale comment at the top of CallManager says that is the rule.
  // The code has always done otherwise. When a comment and the code disagree,
  // the code is the routine.
  //
  // Starts on voicemail every time the page loads, which matches the app's
  // "on launch, next dial is" reset: a stray test dial cannot silently swap the
  // two halves of the routine before you walk on.
  var awaitingDivert = false;
  function nextMode() {
    var mode = awaitingDivert ? "divert" : "voicemail";
    awaitingDivert = !awaitingDivert;
    return mode;
  }

  // ── The call ──────────────────────────────────────────────────────────
  var device = null, conn = null, tick = null, secs = 0;
  var callNum = document.getElementById("callNum");
  var callState = document.getElementById("callState");

  function startTimer() {
    secs = 0;
    clearInterval(tick);
    tick = setInterval(function () {
      secs += 1;
      var m = Math.floor(secs / 60), s = secs % 60;
      callState.textContent = m + ":" + (s < 10 ? "0" : "") + s;
    }, 1000);
  }

  async function getDevice() {
    if (device) return device;
    // The room goes with the request: the endpoint is public by necessity and
    // is gated on the room being one Ringer has configured.
    var r = await fetch("/api/ringer/token?room=" + encodeURIComponent(room),
                        { cache: "no-store" });
    var d = null;
    try { d = await r.json(); } catch (e) {}
    if (r.status === 403) {
      // Overwhelmingly the most common cause, and it used to read "call
      // failed" like everything else.
      throw new Error("room not set up \u2014 send from Ringer first");
    }
    if (!r.ok) throw new Error("token " + r.status);
    if (!d || !d.token) throw new Error((d && d.error) || "no token");
    device = new Twilio.Device(d.token, { codecPreferences: ["opus", "pcmu"] });
    return device;
  }

  callBtn.addEventListener("click", async function () {
    if (!digits) return;
    var number = digits;
    var mode = nextMode();

    // Kept for the incoming screen: the callback has to appear to come from
    // the number they dialled.
    lastDialled = number;
    callNum.textContent = fmt(number);
    callState.textContent = "calling…";
    show("call");
    sendToApp(number);
    addRecent(number);
    digits = ""; paint();

    try {
      var dev = await getDevice();
      // `mode` decides voicemail vs divert. `room` is how the TwiML finds the
      // assistant: it asks the show server for this room's number, server to
      // server, so a real person's phone number never passes through this page.
      // `To` is the dialled number and rides along for the log only -- the
      // TwiML routes on `mode` alone, which is why no stranger is ever called.
      conn = await dev.connect({ params: { mode: mode, room: room, To: number } });
      conn.on("accept", startTimer);
      conn.on("disconnect", function () { hangUp(); });
      conn.on("error", function (err) {
        callState.textContent = "call failed: " + ((err && err.message) || "twilio");
      });
    } catch (e) {
      // The reason, not just the fact. "call failed" for every cause meant a
      // room that was never configured, a denied microphone and a broken
      // token all looked identical from the far side of the room.
      var why = (e && e.message) ? String(e.message) : String(e);
      if (/NotAllowed|Permission|denied/i.test(why)) why = "microphone was blocked";
      callState.textContent = why;
    }
  });

  function hangUp() {
    clearInterval(tick);
    try { if (conn) conn.disconnect(); } catch (e) {}
    conn = null;
    show("keypad");
  }
  document.getElementById("endBtn").addEventListener("click", hangUp);

  document.getElementById("muteBtn").addEventListener("click", function () {
    var b = document.getElementById("muteBtn");
    var on = !b.classList.contains("on");
    b.classList.toggle("on", on);
    try { if (conn) conn.mute(on); } catch (e) {}
  });

  // Cosmetic. iOS Safari plays WebRTC audio through the loudspeaker and gives
  // no way to route it to the earpiece, so this cannot do what it says. It
  // starts lit because the loudspeaker is in fact what is happening.
  document.getElementById("spkBtn").addEventListener("click", function () {
    document.getElementById("spkBtn").classList.toggle("on");
  });

  // ── The FaceTime leg ──────────────────────────────────────────────────
  //
  // The routine ends with the assistant calling back. On a borrowed phone a
  // real FaceTime is impossible three times over -- they have no handle for
  // this phone, the disguise depends on renaming a contact in the PERFORMER'S
  // address book, and Safari cannot receive FaceTime. So it happens here.
  //
  // Which is stronger than the original: the caller identity on this screen is
  // DRAWN. The app renames a real contact so the incoming call shows the
  // dialled number instead of the assistant's name; here that number is simply
  // what the screen says, with no contact touched.
  //
  // THE CAMERA IS NOT REQUESTED UNTIL ACCEPT. A page that asks for the camera
  // while pretending to be a dialler is finished before it starts, so the
  // prompt lands where a real call would put it.
  var vroom = null;
  var lastDialled = "";
  var ringPoll = null;

  function watchForRing() {
    clearInterval(ringPoll);
    if (!room) return;
    ringPoll = setInterval(function () {
      if (vroom || document.getElementById("incoming").classList.contains("on")) return;
      fetch("/api/ringer/" + encodeURIComponent(room) + "/ring", { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (d) { if (d && d.ringing) showIncoming(); })
        .catch(function () {});
    }, 1800);
  }

  // ── Permission, taken once at load ───────────────────────────────────
  //
  // Asked here rather than on accept, deliberately: Shine is the one holding
  // the phone when the page opens, so he dismisses the prompt himself, and
  // nothing interrupts the spectator later.
  //
  // The camera is RELEASED immediately. Holding it open would keep the green
  // recording dot lit in the status bar for the whole routine, which is a far
  // worse tell than any prompt. It comes back only when the call arrives, and
  // at that moment the dot is correct -- a real FaceTime lights it too.
  var mediaReady = false;

  async function askForMedia() {
    if (mediaReady) return true;
    try {
      var st = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
      st.getTracks().forEach(function (t) { t.stop(); });
      mediaReady = true;
      return true;
    } catch (e) { return false; }
  }

  askForMedia().then(function (ok) {
    // Some Safari versions refuse getUserMedia outside a gesture. If the
    // silent attempt failed, take the first touch on the page instead -- he
    // touches it anyway while setting the routine up.
    if (ok) return;
    var once = function () {
      document.removeEventListener("touchend", once);
      askForMedia();
    };
    document.addEventListener("touchend", once);
  });

  // The self-view for the incoming screen, acquired at ring time.
  var selfStream = null;

  async function startSelfView() {
    try {
      selfStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" }, audio: false,
      });
      var v = document.createElement("video");
      v.autoplay = true; v.muted = true;
      v.setAttribute("playsinline", "");
      v.srcObject = selfStream;
      document.getElementById("inSelf").replaceChildren(v);
      document.getElementById("inSelf").classList.add("on");
      document.getElementById("incoming").classList.add("hasCam");
    } catch (e) { /* the avatar fallback stands */ }
  }

  function stopSelfView() {
    try { if (selfStream) selfStream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    selfStream = null;
    document.getElementById("inSelf").replaceChildren();
    document.getElementById("inSelf").classList.remove("on");
    document.getElementById("incoming").classList.remove("hasCam");
  }

  function showIncoming() {
    // The number they dialled, which is the point: it reads as the person they
    // called ringing back.
    document.getElementById("inNum").textContent = lastDialled ? fmt(lastDialled) : "Unknown";
    show("incoming");
    startSelfView();
  }

  // Clearing the ring is how the assistant learns it was answered -- one flag
  // both sides read, rather than a second channel to keep in sync.
  function clearRing() {
    return fetch("/api/ringer/" + encodeURIComponent(room) + "/ring", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ on: false }),
    }).catch(function () {});
  }

  document.getElementById("declineBtn").addEventListener("click", function () {
    clearRing();
    stopSelfView();
    show("keypad");
  });

  document.getElementById("acceptBtn").addEventListener("click", async function () {
    // Drop the voice leg first. Two live audio paths at once would echo.
    try { if (conn) { conn.disconnect(); conn = null; } } catch (e) {}
    clearInterval(tick);
    clearRing();
    // Released before Twilio takes the camera for itself: two claims on the
    // same device is how a black self-view happens.
    stopSelfView();
    document.getElementById("vidLabel").textContent = lastDialled ? fmt(lastDialled) : "";
    show("video");
    try {
      var t = await fetch("/api/ringer/token?kind=video&who=spectator&room="
                          + encodeURIComponent(room), { cache: "no-store" });
      var d = await t.json();
      if (!d || !d.token) throw new Error((d && d.error) || "no token");
      vroom = await Twilio.Video.connect(d.token, {
        name: "ringer-" + room, audio: true,
        video: { facingMode: vidFacing, width: 640 },
      });
      vroom.participants.forEach(attachRemote);
      vroom.on("participantConnected", attachRemote);
      vroom.on("participantDisconnected", endVideo);
      vroom.on("disconnected", endVideo);
      redrawVideo();
    } catch (e) {
      document.getElementById("vidLabel").textContent =
        "Could not connect: " + ((e && e.message) || e);
    }
  });

  // One place decides what goes where, so swapping, flipping and someone
  // joining all end up consistent instead of each patching the DOM its own way.
  var vidFacing = "user";   // which camera this phone is sending
  var selfBig = false;      // which window this phone's own picture is in

  function selfBox() { return document.getElementById(selfBig ? "remoteWrap" : "selfWrap"); }
  function themBox() { return document.getElementById(selfBig ? "selfWrap" : "remoteWrap"); }

  function myVideoTrack() {
    var found = null;
    if (!vroom) return null;
    vroom.localParticipant.videoTracks.forEach(function (pub) { if (pub.track) found = pub.track; });
    return found;
  }

  function theirVideoTrack() {
    var found = null;
    if (!vroom) return null;
    vroom.participants.forEach(function (p) {
      p.videoTracks.forEach(function (pub) { if (pub.track) found = pub.track; });
    });
    return found;
  }

  function attachRemote(p) {
    p.on("trackSubscribed", function () { redrawVideo(); });
    p.on("trackUnsubscribed", function () { redrawVideo(); });
    redrawVideo();
  }

  function redrawVideo() {
    if (!vroom) return;
    var big = document.getElementById("remoteWrap");
    var small = document.getElementById("selfWrap");
    big.replaceChildren(); small.replaceChildren();
    big.classList.remove("mirror"); small.classList.remove("mirror");

    var mine = myVideoTrack();
    var theirs = theirVideoTrack();

    if (mine) {
      var me = mine.attach();
      me.setAttribute("playsinline", ""); me.muted = true;
      selfBox().appendChild(me);
      // A back camera is not mirrored; only a self-view is.
      if (vidFacing === "user") selfBox().classList.add("mirror");
    }
    if (theirs) {
      var them = theirs.attach();
      them.setAttribute("playsinline", "");
      themBox().appendChild(them);
    }
    vroom.participants.forEach(function (p) {
      p.audioTracks.forEach(function (pub) {
        if (!pub.track) return;
        var a = pub.track.attach();
        a.style.display = "none";
        big.appendChild(a);
      });
    });
  }

  // Tap the small window to swap, the way FaceTime does.
  document.getElementById("selfWrap").addEventListener("click", function (e) {
    e.stopPropagation();
    if (!vroom) return;
    selfBig = !selfBig;
    redrawVideo();
  });

  // Front or back camera, for when the spectator should be showing something
  // rather than themselves.
  document.getElementById("vidFlip").addEventListener("click", async function (e) {
    e.stopPropagation();
    if (!vroom) return;
    var wanted = (vidFacing === "user") ? "environment" : "user";
    try {
      var fresh = await Twilio.Video.createLocalVideoTrack({ facingMode: wanted, width: 640 });
      var old = myVideoTrack();
      if (old) {
        vroom.localParticipant.unpublishTrack(old);
        old.detach().forEach(function (el) { el.remove(); });
        old.stop();
      }
      await vroom.localParticipant.publishTrack(fresh);
      vidFacing = wanted;
      redrawVideo();
    } catch (err) { /* stay on the camera we had */ }
  });

  function endVideo() {
    try { if (vroom) vroom.disconnect(); } catch (e) {}
    vroom = null;
    document.getElementById("remoteWrap").replaceChildren();
    document.getElementById("selfWrap").replaceChildren();
    show("keypad");
  }

  document.getElementById("vidEnd").addEventListener("click", endVideo);

  watchForRing();

  paint();
})();
</script>
</body>
</html>
