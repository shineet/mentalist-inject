<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>YouTube</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #fff; color: #030303;
    font: 14px/1.4 Roboto, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
  #bar { background: #212121; height: 48px; display: flex; align-items: center; padding: 0 12px; }
  .box { width: 30px; height: 21px; background: #fff; border-radius: 4px;
         display: flex; align-items: center; justify-content: center; margin-right: 5px; }
  .box::after { content: ""; border-left: 8px solid #212121; border-top: 5px solid transparent;
                border-bottom: 5px solid transparent; margin-left: 2px; }
  #bar span { color: #fff; font-size: 17px; font-weight: 500; letter-spacing: -.4px; }
  #screen { width: 100%; aspect-ratio: 16/9; background: #000;
            display: flex; align-items: center; justify-content: center; }
  .ring { width: 46px; height: 46px; border-radius: 50%; border: 3px solid transparent;
          border-top-color: #fff; border-right-color: #fff; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #info { padding: 14px; }
  #info b { font-weight: 400; font-size: 16px; }
  #info i { display: block; color: #606060; font-size: 13px; margin-top: 5px; font-style: normal; }

  #cover { position: fixed; inset: 0; z-index: 9; background: rgba(0,0,0,.72);
           display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 30px; padding: 0 26px; text-align: center; }
  #cover p { color: #fff; font-size: 30px; font-weight: 700; line-height: 1.25; margin: 0; }
  #cover .circle { width: 150px; height: 150px; border-radius: 50%; background: #fff; }
  #done { display: none; position: fixed; inset: 0; z-index: 10; background: #fff;
          flex-direction: column; align-items: center; justify-content: center; gap: 14px;
          padding: 0 30px; text-align: center; color: #030303; }
  #done h1 { font-size: 20px; margin: 0; }
  #done p { color: #606060; font-size: 14px; margin: 0; line-height: 1.5; }
</style>
</head>
<body>

<div id="bar"><div class="box"></div><span>YouTube</span></div>
<div id="screen"><div class="ring"></div></div>
<div id="info"><b>Loading&hellip;</b><i>Vevo &middot; 23,565,897 views</i></div>

<div id="cover">
  <p>Tap here once to stop the display from sleeping.</p>
  <div class="circle"></div>
</div>

<div id="done">
  <h1>This phone is ready.</h1>
  <p>If YouTube opened as an app, nothing more is needed. If it opened in Safari,
     tap <b>OPEN</b> on the banner at the top once, then come back and open the
     real link.</p>
</div>

<script>
  // PRIMING A BORROWED PHONE. Not part of the effect -- the step before it.
  //
  // iOS keeps a PER-DOMAIN preference for universal links. A phone that has
  // once been sent to Safari for youtube.com keeps going to Safari, and that
  // setting lives on the spectator's phone where no amount of code here can
  // reach it. It is why the same build opened the app on one phone and Safari
  // on the next, and why Earworm looked like it was doing something we were not.
  //
  // So: open this, tap once, and watch what happens.
  //   the YouTube APP opens   -> the phone was already primed. Nothing to do.
  //   Safari opens instead    -> tap OPEN on its banner. That sets the
  //                              preference, permanently, and every youtube.com
  //                              link afterwards goes to the app.
  // Then open the real link and perform. The phone is clean either way: this
  // page and the dummy video are the only things in its history.
  //
  // The navigation is in the click handler, synchronously, which is the one
  // arrangement that reaches the app every time regardless of priming.
  var m = location.pathname.match(/^\/p(?:\/([A-Za-z0-9_-]+))?\/?$/);
  var room = (m && m[1]) || "x";
  var videoId = "jNQXAC9IVRw";   // replaced below if the room names another
  var gone = false;

  fetch("/api/yt/" + encodeURIComponent(room) + "/state", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.ok && d.state && d.state.primeVideoId) videoId = d.state.primeVideoId;
    })
    .catch(function () {});

  document.addEventListener("click", function () {
    if (gone) return;
    gone = true;
    // Shown for the trip back: whichever way iOS went, this is what greets him.
    document.getElementById("cover").style.display = "none";
    document.getElementById("done").style.display = "flex";
    location.href = "/yt-go/" + encodeURIComponent(videoId);
  });
</script>
</body>
</html>
