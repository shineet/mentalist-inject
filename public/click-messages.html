<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Click-Through Messages</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
    font-family: Georgia, 'Times New Roman', serif;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    padding: 0 8vw;
  }
  .line {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.9s ease, transform 0.9s ease;
    color: #ffd76a;
    font-size: clamp(34px, 8vw, 120px);
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1.3;
    white-space: pre-line;
  }
  .line.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<div id="stage">
  <div class="line" id="mainLine"></div>
</div>

<script>
  // Click-through message reveal: launch this page, then advance one step
  // at a time -- click anywhere, or press any key (a Bluetooth presenter
  // remote usually emulates a keypress). Sequence alternates black / message
  // so each message appears alone on a blank black screen, then clicking
  // again clears back to black before the next one. Stops on the final
  // black screen once all 5 have been shown -- no wraparound.
  // ArrowLeft / Backspace goes back one step, in case of an accidental
  // over-click.
  //
  // To reuse for a different set of messages, just edit the MESSAGES array
  // below -- everything else adapts automatically.
  const MESSAGES = [
    'Power of\nINFLUENCE',
    'Say “NOT TODAY”\nto\nFailure',
    '"Empathy"',
    'Two heads\nare\nbetter\nthan One',
    'Moment\nis\nNOW',
  ];

  // Interleave: black, msg1, black, msg2, black, ... , msgN, black
  const STATES = [''];
  for (const m of MESSAGES) { STATES.push(m); STATES.push(''); }

  const mainLine = document.getElementById('mainLine');
  let index = 0;

  function render() {
    const text = STATES[index];
    mainLine.classList.remove('show');
    setTimeout(() => {
      mainLine.textContent = text;
      requestAnimationFrame(() => {
        if (text) mainLine.classList.add('show');
      });
    }, 250);
  }

  function next() {
    if (index >= STATES.length - 1) return;
    index++;
    render();
  }

  function prev() {
    if (index <= 0) return;
    index--;
    render();
  }

  document.addEventListener('click', next);
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'Backspace') { e.preventDefault(); prev(); }
    else next();
  });
</script>

</body>
</html>
