<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- No maximum-scale and no user-scalable=no. Pinch zoom IS the effect: the
       whole point is that the lettering is only legible when somebody zooms
       right into it, so anything that constrains the zoom breaks the trick. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Photo</title>
  <style>
    /* Deliberately bare. Nothing on this page may look like an app: a spectator
       is being shown a photograph, and any chrome invites the thought that the
       photograph is something a program is doing. */
    html, body {
      margin: 0; padding: 0; background: #000;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }
    #frame {
      position: relative;
      width: 100%;
      line-height: 0;
    }
    #orig { width: 100%; height: auto; display: block; }

    /* The two layers sit exactly over the patch, in percentages of the frame,
       so they follow the photograph at any width and at any zoom. They are in
       the document from the start -- laid out, decoded, and merely invisible --
       so that revealing them is a visibility change and not a load. */
    #patch, #reveal {
      position: absolute;
      display: block;
      visibility: hidden;
      /* No transition of any kind, anywhere. A fade is exactly the thing the
         audience must not catch out of the corner of an eye. */
      transition: none !important;
      animation: none !important;
      image-rendering: auto;
      pointer-events: none;
    }
    #note {
      position: fixed; left: 0; right: 0; bottom: 0;
      font: 11px -apple-system, system-ui, sans-serif;
      color: rgba(255,255,255,0.28);
      text-align: center; padding: 6px; line-height: 1.3;
      pointer-events: none;
    }
    #note.hidden { display: none; }

    /* LANDING ZOOM (?zoom=2.5&cx=0.6&cy=0.3). The page opens already zoomed in
       on a chosen part of the photo, so the card is out of view, and from then
       on the zoom belongs to the spectator: they pinch out with their own
       fingers. This page does the zooming itself rather than leaving it to
       Safari, because (a) Safari cannot be told to START zoomed, and (b) this
       page usually lives in an iframe, where Safari's pinch zooms the outer
       page instead. Zoom is real layout (the frame is given its zoomed size),
       not a CSS scale, so the photograph is re-rasterised sharp at every zoom
       instead of a blurry enlargement of the screen-sized picture. */
    body.zoomable { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
    body.zoomable #frame { position: absolute; left: 0; top: 0; width: auto; visibility: hidden; }
    body.zoomable #orig { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="frame">
    <img id="orig" alt="" draggable="false" />
    <img id="patch" alt="" draggable="false" />
    <img id="reveal" alt="" draggable="false" />
  </div>
  <div id="note" class="hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
  (function () {
    "use strict";

    // The room is a capability: holding the link is the whole permission model,
    // exactly as the plant link already works. This page can only ever READ --
    // it has no token, and the endpoint that changes anything refuses a request
    // without one.
    const params = new URLSearchParams(location.search);
    const room = (params.get("r") || params.get("room") || "").replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 40);
    const debug = params.get("debug") === "1";

    const orig = document.getElementById("orig");
    const patch = document.getElementById("patch");
    const reveal = document.getElementById("reveal");
    const note = document.getElementById("note");

    // ---- landing zoom -------------------------------------------------------
    const frame = document.getElementById("frame");
    const startZoom = Math.min(12, Math.max(1, parseFloat(params.get("zoom") || "1") || 1));
    const zoomable = startZoom > 1.001;
    let imgW = 0, imgH = 0;          // the photograph's own pixel size
    let view = { s: startZoom,       // zoom relative to "whole photo fits the screen"
                 cx: clamp01(parseFloat(params.get("cx") || "0.5")),   // view centre, as fractions of the photo
                 cy: clamp01(parseFloat(params.get("cy") || "0.5")) };
    let laidOut = false;
    function clamp01(v) { return isFinite(v) ? Math.min(1, Math.max(0, v)) : 0.5; }
    if (zoomable) document.body.classList.add("zoomable");

    function fitScale() { return Math.min(window.innerWidth / imgW, window.innerHeight / imgH); }

    // Draw the frame for the current view. The centre is clamped so the photo
    // never leaves an edge of the screen bare while it is bigger than the screen.
    function layout() {
      if (!zoomable || !imgW || !imgH) return;
      const Vw = window.innerWidth, Vh = window.innerHeight;
      const k = fitScale() * view.s;               // screen px per photo px
      const w = imgW * k, h = imgH * k;
      let x = Vw / 2 - view.cx * w, y = Vh / 2 - view.cy * h;
      if (w <= Vw) x = (Vw - w) / 2; else x = Math.min(0, Math.max(Vw - w, x));
      if (h <= Vh) y = (Vh - h) / 2; else y = Math.min(0, Math.max(Vh - h, y));
      view.cx = (Vw / 2 - x) / w; view.cy = (Vh / 2 - y) / h;   // keep what the clamp did
      frame.style.width = w + "px"; frame.style.height = h + "px";
      frame.style.left = x + "px"; frame.style.top = y + "px";
      if (!laidOut && orig.complete && orig.naturalWidth) {
        // Only now: the first frame anybody sees is already the zoomed one.
        frame.style.visibility = "visible";
        laidOut = true;
      }
    }

    function setImageSize(w, h) {
      if (!w || !h || (w === imgW && h === imgH)) return;
      imgW = w; imgH = h; layout();
    }

    if (zoomable) {
      window.addEventListener("resize", layout);
      let pinch = null, pan = null;
      function mid(t) { return { x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 }; }
      function dist(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
      function photoPoint(px, py) {      // screen point -> photo fraction under it
        const r = frame.getBoundingClientRect();
        return { fx: (px - r.left) / r.width, fy: (py - r.top) / r.height };
      }
      // Put photo fraction (fx,fy) under screen point (px,py) at zoom s.
      function anchor(fx, fy, px, py, s) {
        const k = fitScale() * s, w = imgW * k, h = imgH * k;
        view.s = s;
        view.cx = (window.innerWidth / 2 - (px - fx * w)) / w;
        view.cy = (window.innerHeight / 2 - (py - fy * h)) / h;
        layout();
      }
      document.addEventListener("touchstart", function (e) {
        if (e.touches.length >= 2) {
          const m = mid(e.touches);
          pinch = { d: dist(e.touches), s: view.s, p: photoPoint(m.x, m.y) }; pan = null;
        } else if (e.touches.length === 1) {
          pan = { x: e.touches[0].clientX, y: e.touches[0].clientY, p: photoPoint(e.touches[0].clientX, e.touches[0].clientY) };
        }
      }, { passive: false });
      document.addEventListener("touchmove", function (e) {
        e.preventDefault();
        if (pinch && e.touches.length >= 2) {
          const m = mid(e.touches);
          const s = Math.min(12, Math.max(1, pinch.s * dist(e.touches) / pinch.d));
          anchor(pinch.p.fx, pinch.p.fy, m.x, m.y, s);
        } else if (pan && e.touches.length === 1) {
          anchor(pan.p.fx, pan.p.fy, e.touches[0].clientX, e.touches[0].clientY, view.s);
        }
      }, { passive: false });
      document.addEventListener("touchend", function (e) {
        if (e.touches.length === 0) { pinch = null; pan = null; }
        else if (e.touches.length === 1) {
          pinch = null;
          pan = { x: e.touches[0].clientX, y: e.touches[0].clientY, p: photoPoint(e.touches[0].clientX, e.touches[0].clientY) };
        }
      });
      // Safari's own pinch (iPhone, and a Mac trackpad): take it over rather
      // than let the browser zoom the page, which can only zoom IN from 100%.
      let gesture = null;
      document.addEventListener("gesturestart", function (e) {
        e.preventDefault();
        gesture = { s: view.s, p: photoPoint(e.clientX, e.clientY), x: e.clientX, y: e.clientY };
      });
      document.addEventListener("gesturechange", function (e) {
        e.preventDefault();
        if (!gesture || pinch) return;   // touch pinch already handles iPhone
        const s = Math.min(12, Math.max(1, gesture.s * e.scale));
        anchor(gesture.p.fx, gesture.p.fy, gesture.x, gesture.y, s);
      });
      document.addEventListener("gestureend", function (e) { e.preventDefault(); gesture = null; });

      // Computers. A trackpad pinch arrives as a wheel event with ctrlKey set
      // (Chrome, Edge, Firefox); two-finger scroll and a mouse wheel pan.
      document.addEventListener("wheel", function (e) {
        e.preventDefault();
        if (e.ctrlKey) {
          const p = photoPoint(e.clientX, e.clientY);
          const s = Math.min(12, Math.max(1, view.s * Math.exp(-e.deltaY * 0.01)));
          anchor(p.fx, p.fy, e.clientX, e.clientY, s);
        } else {
          const r = frame.getBoundingClientRect();
          view.cx += e.deltaX / r.width; view.cy += e.deltaY / r.height;
          layout();
        }
      }, { passive: false });

      // A mouse drag pans.
      let mouse = null;
      document.addEventListener("mousedown", function (e) {
        mouse = { p: photoPoint(e.clientX, e.clientY) }; e.preventDefault();
      });
      document.addEventListener("mousemove", function (e) {
        if (mouse) anchor(mouse.p.fx, mouse.p.fy, e.clientX, e.clientY, view.s);
      });
      document.addEventListener("mouseup", function () { mouse = null; });
      orig.addEventListener("load", function () { setImageSize(orig.naturalWidth, orig.naturalHeight); layout(); });
    }

    let currentSeq = -1;
    let placedFor = "";
    let shown = false;

    function say(text) {
      if (!debug) return;
      note.classList.remove("hidden");
      note.textContent = text;
    }

    // Where the patch sits, as percentages of the photograph. Percentages
    // rather than pixels because the photograph is displayed at whatever width
    // the phone is, and a pixel offset would be right on exactly one device.
    // Re-placed whenever the numbers change, not once and never again.
    //
    // It used to place on the first state it saw and guard against doing it
    // twice. A performer who re-marks and re-cleans a template sends a new
    // rectangle, and a page already open kept the OLD coordinates while
    // loading the NEW patch -- so the reveal landed where the previous box had
    // been, on a page that had every correct number in hand.
    function place(state) {
      if (state.imageSize) setImageSize(state.imageSize.width, state.imageSize.height);
      if (!state.patchRect || !state.imageSize) return;
      const r = state.patchRect, s = state.imageSize;
      if (!s.width || !s.height) return;
      const key = [r.x, r.y, r.width, r.height, s.width, s.height].join(",");
      if (key === placedFor) return;
      for (const el of [patch, reveal]) {
        el.style.left = (r.x / s.width * 100) + "%";
        el.style.top = (r.y / s.height * 100) + "%";
        el.style.width = (r.width / s.width * 100) + "%";
        el.style.height = (r.height / s.height * 100) + "%";
      }
      placedFor = key;
      say("placed at " + key);
    }

    // Load and fully decode before anything is shown. decode() is the whole
    // reason there is no flash: it resolves only once the bitmap is ready to
    // paint, so making the element visible afterwards cannot produce a blank
    // frame, a partial row or a progressive JPEG crawling into view.
    function preload(img, url) {
      return new Promise(function (resolve) {
        if (!url) return resolve(false);
        if (img.getAttribute("src") === url && img.complete) return resolve(true);
        img.onload = function () {
          const done = img.decode ? img.decode() : Promise.resolve();
          done.then(function () { resolve(true); }).catch(function () { resolve(true); });
        };
        img.onerror = function () { resolve(false); };
        img.src = url;
      });
    }

    function showReveal(state, recvTs) {
      // Both layers become visible inside one frame. The cleared surface and
      // the new lettering must arrive together: showing the patch first would
      // put a blank plate on screen, which is the single most damaging frame
      // this page could ever draw.
      requestAnimationFrame(function () {
        patch.style.visibility = "visible";
        reveal.style.visibility = "visible";
        shown = true;
        const renderTs = Date.now();
        say("reveal " + state.value + " · " + (renderTs - (state.committedAt || renderTs)) + " ms");
        try {
          socket.emit("photo:ack", { room: room, recvTs: recvTs, renderTs: renderTs });
        } catch (e) {}
      });
    }

    function hideReveal() {
      patch.style.visibility = "hidden";
      reveal.style.visibility = "hidden";
      shown = false;
      say("original");
    }

    async function apply(state, recvTs) {
      if (!state || state.seq === currentSeq) return;
      currentSeq = state.seq;

      // The original is fetched ONCE, ever. Every later state change reuses the
      // element that is already on screen, so the photograph the spectator is
      // looking at is never re-requested and never repainted.
      if (state.originalUrl && orig.getAttribute("src") !== state.originalUrl) {
        await preload(orig, state.originalUrl);
        if (zoomable) { setImageSize(orig.naturalWidth, orig.naturalHeight); layout(); }
      }
      place(state);
      if (state.patchUrl) await preload(patch, state.patchUrl);

      if (state.mode === "reveal" && state.revealUrl) {
        const ok = await preload(reveal, state.revealUrl);
        if (ok) showReveal(state, recvTs);
      } else if (shown) {
        hideReveal();
      } else {
        say("original");
      }
    }

    // First paint comes from a plain fetch rather than waiting on the socket:
    // somebody opening the link should see the photograph immediately, and
    // somebody opening it AFTER the reveal should see the revealed one.
    fetch("/api/photo/" + encodeURIComponent(room) + "/state", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j && j.ok) apply(j.state, Date.now()); })
      .catch(function () { say("could not reach the room"); });

    const socket = io({ transports: ["websocket", "polling"] });
    socket.on("connect", function () { socket.emit("photo:join", { room: room }); });
    socket.on("photo:state", function (state) { apply(state, Date.now()); });

    // Coming back from the lock screen or the app switcher: re-join, and let
    // the server's reply correct anything missed while the socket was asleep.
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") {
        try { socket.emit("photo:join", { room: room }); } catch (e) {}
      }
    });
  })();
  </script>
</body>
</html>
