<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Loading video</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #000; color: #fff;
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  /* The whole screen is the button. "Press play" said out loud and a finger
     landing anywhere near the middle has to work -- a spectator aiming at a
     48pt circle on someone else's phone is a spectator who misses. */
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
  }
  .spinner {
    width: 32px; height: 32px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.16);
    border-top-color: rgba(255,255,255,0.8);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #bad { display: none; color: #8e8e93; font-size: 13px; max-width: 28ch; text-align: center; padding: 0 28px; }
</style>
</head>
<body>

<div id="stage">
  <div class="spinner" id="spin"></div>
  <div id="bad">This link is missing its room. Ask for it again.</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  // The spectator's phone. It holds a socket open, and when a video arrives it
  // navigates. Nobody touches it.
  //
  // IT MUST NAVIGATE TO /yt-go/<id>, NOT TO youtube.com DIRECTLY.
  //
  // That single detail is the difference between the YouTube app and Safari,
  // and it was found by measurement rather than reasoning, after three wrong
  // fixes. A diagnostic page offered the same video six ways on the same
  // phone:
  //
  //    location.href = youtube.com/watch   on a timer   -> Safari
  //    location.href = youtu.be/           on a timer   -> Safari
  //    the same two inside a click handler              -> the app
  //    a plain <a href>, tapped                         -> the app
  //    location.href = /yt-go/<id>, a 302, on a timer   -> THE APP
  //
  // So iOS does want a user gesture for a universal link reached by an
  // in-page navigation -- but a server redirect is not an in-page navigation,
  // and the redirect chain gets the app with nothing and nobody touching the
  // screen. youtube:// was tried too and is worse than both: it opens the app
  // and asks "Open in YouTube?" first, and a spectator confirming a dialog is
  // the effect over.
  //
  // The page still never names the song. It is a spinner, and then it is gone.
  var params = new URLSearchParams(location.search);
  // Two ways in, because Shine TYPES this on the spectator's phone while
  // appearing to search YouTube: the short /y/<room> path, and the original
  // ?r=<room> query that existing links still use.
  var room = (params.get("r") || params.get("room") || "");
  if (!room) {
    var m = location.pathname.match(/^\/y(?:\/([A-Za-z0-9_-]+))?\/?$/);
    if (m) room = m[1] || "x";
  }
  room = room.replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 40);

  var spin = document.getElementById("spin");
  var stage = document.getElementById("stage");

  if (!room) {
    spin.style.display = "none";
    document.getElementById("bad").style.display = "block";
  }

  var loadedAt = Date.now();
  // Overridable for testing: ?settle=5000 reproduces the diagnostic's five
  // second countdown exactly, ?settle=0 removes the wait entirely. The
  // diagnostic proved the redirect with a five second countdown and the real
  // page waits one; that gap is one of the few things left that differs.
  var SETTLE_MS = parseInt(params.get("settle") || "1200", 10);
  // ?debug=1 puts what this page is actually doing on the screen. Without it
  // a page that navigated to the wrong URL and a page that navigated to the
  // right one look identical from the far side.
  var debug = params.get("debug") === "1";
  var pending = "";
  var gone = false;
  var scheduled = false;

  function say(msg) {
    if (!debug) return;
    var d = document.getElementById("dbg");
    if (!d) {
      d = document.createElement("div");
      d.id = "dbg";
      d.style.cssText = "position:fixed;left:0;right:0;top:0;padding:10px 12px;"
        + "background:#111;color:#0f0;font:11px/1.4 ui-monospace,Menlo,monospace;"
        + "white-space:pre-wrap;z-index:99;";
      document.body.appendChild(d);
    }
    d.textContent += msg + "\n";
  }

  function go(videoId) {
    if (gone || scheduled || !videoId) return;
    pending = videoId;

    // THE PAGE DOES NOT NAVIGATE BY ITSELF, AND THAT IS DELIBERATE.
    //
    // Measured on one phone, every combination:
    //
    //   a plain <a href>, tapped                        -> the app
    //   location.href, inside a click handler           -> the app
    //   a countdown STARTED BY A TAP, then a 302        -> the app
    //   a countdown started by a tap, direct URL        -> Safari
    //   a countdown started on page load, 302           -> Safari
    //   the same, with a stray tap during it            -> Safari
    //
    // Every path with a tap behind it opens the YouTube app. Every path
    // without one lands in Safari. The 302 looked like an exception for a
    // while; it was not, it was started by tapping a button.
    //
    // So a page cannot do this alone, and does not need to. Shine is HOLDING
    // the phone at this moment -- he loaded the page on it, kept it, and
    // dials the song before handing it back. His touch is free, invisible,
    // and already in the routine. The spectator never touches anything, which
    // was the requirement.
    //
    // ?auto=1 restores the automatic attempt for anyone wanting to retest it.
    scheduled = true;
    say("ready \u2022 " + videoId + " \u2022 waiting for a touch");
    if (params.get("auto") !== "1") return;

    var wait = Math.max(0, SETTLE_MS - (Date.now() - loadedAt));
    var target = "/yt-go/" + encodeURIComponent(videoId);
    say("auto \u2022 waiting " + wait + "ms \u2022 then " + target);
    setTimeout(function () {
      gone = true;
      location.href = target;
    }, wait);
  }

  // The touch that does everything. It must stay synchronous -- a navigation
  // counts as coming from the gesture only while the handler is still running,
  // so a timeout, a promise or an await here would put it straight back into
  // Safari.
  //
  // The whole screen, not a button: a glance down at a phone in one hand
  // while talking is not an aimed tap.
  stage.addEventListener("click", function () {
    if (!pending || gone) return;
    gone = true;
    location.href = "https://www.youtube.com/watch?v=" + pending;
  });

  if (room) {
    var socket = io({ transports: ["websocket", "polling"] });

    socket.on("connect", function () {
      say("socket up at " + (Date.now() - loadedAt) + "ms");
      socket.emit("yt:join", { room: room });
    });
    // A reconnect has to re-join: the server tracks membership per socket and
    // a new socket is in no rooms. Without this a phone that dropped for a
    // moment looks connected and receives nothing.
    socket.io.on("reconnect", function () { socket.emit("yt:join", { room: room }); });

    socket.on("yt:state", function (state) {
      if (state && state.mode === "play" && state.videoId) go(state.videoId);
    });

    // For a socket that never comes up at all -- a captive portal, a hostile
    // guest network. Slow on purpose: the socket is the real path and this
    // only has to beat "nothing ever happens".
    setInterval(function () {
      if (scheduled || gone) return;
      fetch("/api/yt/" + encodeURIComponent(room) + "/state", { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && d.ok && d.state && d.state.mode === "play" && d.state.videoId) go(d.state.videoId);
        })
        .catch(function () {});
    }, 4000);
  }
</script>
</body>
</html>
