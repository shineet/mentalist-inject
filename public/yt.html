<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Video</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #000; color: #fff;
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  /* The whole screen is the button, not just the circle. Someone picking up a
     phone and pressing the obvious thing in the middle should not be able to
     miss, and a near miss reads as the effect failing. */
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
  }
  .spinner {
    width: 32px; height: 32px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.16);
    border-top-color: rgba(255,255,255,0.8);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #bad { display: none; color: #8e8e93; font-size: 13px; max-width: 28ch;
         text-align: center; padding: 0 28px; }
</style>
</head>
<body>

<div id="stage">
  <div class="spinner" id="spin"></div>
  <div id="bad">This link is missing its room. Ask for it again.</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  // The spectator's phone. A spinner, and then the song is playing.
  //
  // IT PLAYS IN SAFARI, AND THAT IS THE DESIGN, NOT A COMPROMISE.
  //
  // Eight ways of opening a youtube.com link were measured on one phone. The
  // rule is that a touch has to be in the call stack AT THE MOMENT of
  // navigation -- not earlier on the page, not the touch that created the
  // timer, not a navigation begun in a touch and held open server-side (that
  // one reaches the app but asks "Open in YouTube?" first). There is no
  // arrangement where nobody touches the phone and the YouTube app opens.
  //
  // A play button was built to supply that touch and then removed, because it
  // is the one thing in the whole effect that gives it away: a stranger's
  // phone showing an unfamiliar button on a page that is plainly not YouTube
  // announces that an app is involved before anything has happened.
  //
  // Safari is right for the story anyway. Shine says he is searching Google
  // for their song. A browser then playing that song is exactly what would
  // happen if he had.
  //
  // The page never names the song, and nobody touches it.
  var params = new URLSearchParams(location.search);
  var room = (params.get("r") || params.get("room") || "");
  if (!room) {
    var m = location.pathname.match(/^\/y(?:\/([A-Za-z0-9_-]+))?\/?$/);
    if (m) room = m[1] || "x";
  }
  room = room.replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 40);

  var spin = document.getElementById("spin");
  var bar = document.getElementById("bar");
  var stage = document.getElementById("stage");

  if (!room) {
    spin.style.display = "none";
    document.getElementById("bad").style.display = "block";
  }

  var pending = "";
  var gone = false;

  var loadedAt = Date.now();
  var SETTLE_MS = parseInt(params.get("settle") || "900", 10);

  function ready(videoId) {
    if (gone || pending || !videoId) return;
    pending = videoId;
    // A short settle so the jump does not land inside the page load, which is
    // the one timing case never measured. It costs a beat nobody sees.
    var wait = Math.max(0, SETTLE_MS - (Date.now() - loadedAt));
    setTimeout(function () {
      if (gone) return;
      gone = true;
      location.href = "https://www.youtube.com/watch?v=" + videoId;
    }, wait);
  }

  // MUST stay synchronous. The navigation counts as coming from the touch
  // only while this handler is still on the stack -- a timeout, a promise or
  // an await here puts it straight back into Safari, which is the entire
  // finding above.
  // A silent safety net, never mentioned and never relied on: if the automatic
  // jump is ever refused, one touch anywhere finishes it -- and a touch, being
  // a gesture, opens the YouTube app rather than Safari.
  stage.addEventListener("click", function () {
    if (!pending || gone) return;
    gone = true;
    location.href = "https://www.youtube.com/watch?v=" + pending;
  });

  if (room) {
    var socket = io({ transports: ["websocket", "polling"] });

    socket.on("connect", function () { socket.emit("yt:join", { room: room }); });
    // A reconnect has to re-join: the server tracks membership per socket and
    // a new socket is in no rooms. Without this a phone that dropped for a
    // moment looks connected and receives nothing.
    socket.io.on("reconnect", function () { socket.emit("yt:join", { room: room }); });

    socket.on("yt:state", function (state) {
      if (state && state.mode === "play" && state.videoId) ready(state.videoId);
    });

    // For a socket that never comes up at all -- a captive portal, a hostile
    // guest network. Slow on purpose: the socket is the real path and this
    // only has to beat "nothing ever happens".
    setInterval(function () {
      if (pending || gone) return;
      fetch("/api/yt/" + encodeURIComponent(room) + "/state", { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && d.ok && d.state && d.state.mode === "play" && d.state.videoId) ready(d.state.videoId);
        })
        .catch(function () {});
    }, 4000);
  }
</script>
</body>
</html>
