<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Music</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #000; color: #fff;
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    user-select: none; -webkit-user-select: none;
  }
  #stage { position: fixed; inset: 0; display: flex; flex-direction: column;
           align-items: center; justify-content: center; gap: 22px; padding: 0 28px; }

  /* Before the tap. The whole screen is the button: a performer holding a
     stranger's phone should not have to aim. */
  #play { width: 84px; height: 84px; border-radius: 50%;
          background: rgba(255,255,255,0.1); display: flex; align-items: center;
          justify-content: center; }
  #play::after { content: ""; border-left: 26px solid rgba(255,255,255,0.92);
                 border-top: 16px solid transparent; border-bottom: 16px solid transparent;
                 margin-left: 7px; }

  /* After the tap, and before the song. Deliberately almost nothing: the phone
     is face down at this point, and an animation here is a thing that can be
     caught moving when it should not be. */
  #held { display: none; }
  #held .bars { display: flex; gap: 4px; align-items: flex-end; height: 22px; }
  #held .bars i { width: 4px; background: rgba(255,255,255,0.35); border-radius: 2px;
                  animation: eq 1.1s ease-in-out infinite; }
  #held .bars i:nth-child(1) { height: 8px;  animation-delay: 0s; }
  #held .bars i:nth-child(2) { height: 18px; animation-delay: .15s; }
  #held .bars i:nth-child(3) { height: 12px; animation-delay: .3s; }
  #held .bars i:nth-child(4) { height: 20px; animation-delay: .45s; }
  @keyframes eq { 0%,100% { transform: scaleY(0.5); } 50% { transform: scaleY(1); } }

  /* The reveal. */
  #now { display: none; flex-direction: column; align-items: center; gap: 18px; width: 100%; }
  #art { width: min(72vw, 300px); aspect-ratio: 1; border-radius: 14px;
         background: #1c1c1e; object-fit: cover; box-shadow: 0 18px 50px rgba(0,0,0,0.6); }
  #title { font-size: 20px; font-weight: 700; text-align: center; line-height: 1.25;
           max-width: 22ch; }
  #artist { font-size: 15px; color: #8e8e93; text-align: center; margin-top: -10px; }
  #bar { width: min(72vw, 300px); height: 4px; border-radius: 2px;
         background: rgba(255,255,255,0.18); overflow: hidden; }
  #bar > span { display: block; height: 100%; width: 0; background: #fff; }

  #bad { display: none; color: #8e8e93; font-size: 13px; max-width: 28ch; text-align: center; }
</style>
</head>
<body>

<div id="stage">
  <div id="play"></div>
  <div id="held"><div class="bars"><i></i><i></i><i></i><i></i></div></div>
  <div id="now">
    <img id="art" alt="">
    <div id="title"></div>
    <div id="artist"></div>
    <div id="bar"><span></span></div>
  </div>
  <div id="bad">This link is missing its room. Ask for it again.</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  // The spectator's phone.
  //
  // READ THIS BEFORE CHANGING THE PLAYBACK. It was measured, twice, on three
  // phones, and every shortcut here has already been tried and failed.
  //
  // 1. A phone will not open the YouTube app without a finger in the call
  //    stack AT THE MOMENT of navigation. Eleven arrangements measured. There
  //    is no version of this where nobody touches the phone and the app opens.
  //
  // 2. Falling back to Safari does not work either, and this is the one that
  //    cost the most. iOS grants autoplay-with-sound per ORIGIN, from that
  //    viewer's own history with it. Shine has played karaoke on this origin
  //    hundreds of times, so it played on his phone and on no other phone
  //    ever. HIS PHONE CANNOT TEST THIS FEATURE. Two other phones failed it
  //    while his passed.
  //
  // 3. A tap from the performer does buy the permission -- but it belongs to
  //    the media ELEMENT and is DISCARDED THE MOMENT ITS src CHANGES. Blessing
  //    an element on silence and then swapping in the song fails. Measured on
  //    a fresh phone: fails. On Shine's: passes, for reason 2. This is exactly
  //    the trap that made reason 2 take two days to see.
  //
  // So: the src is set ONCE, inside the tap, and never again. The server
  // answers at once with silence and holds the response open, then splices the
  // song onto the same body. Nothing restarts, so nothing asks permission
  // twice. Verified on a phone with no history here.
  //
  // The handling is Earworm's, and it is the reason this works as a trick and
  // not merely as code: the phone is MUTED and set playing BEFORE the song is
  // named, it goes back face down, and the volume comes up under the
  // spectator's own thumb. The performer's tap happens when there is nothing
  // yet to be suspicious of.
  var params = new URLSearchParams(location.search);
  var room = (params.get("r") || params.get("room") || "");
  if (!room) {
    var m = location.pathname.match(/^\/y(?:\/([A-Za-z0-9_-]+))?\/?$/);
    if (m) room = m[1] || "x";
  }
  room = room.replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 40);

  var elPlay = document.getElementById("play");
  var elHeld = document.getElementById("held");
  var elNow = document.getElementById("now");
  var elArt = document.getElementById("art");
  var elTitle = document.getElementById("title");
  var elArtist = document.getElementById("artist");
  var elFill = document.querySelector("#bar > span");
  var stage = document.getElementById("stage");

  if (!room) {
    elPlay.style.display = "none";
    document.getElementById("bad").style.display = "block";
  }

  var audio = new Audio();
  audio.preload = "auto";
  var armed = false;
  var revealed = false;

  // MUST stay synchronous, and must set src exactly once. An await, a promise
  // or a second assignment here puts the phone back to silent -- see note 3.
  stage.addEventListener("click", function () {
    if (armed || !room) return;
    armed = true;
    audio.src = "/api/yt/" + encodeURIComponent(room) + "/stream";
    audio.play();
    elPlay.style.display = "none";
    elHeld.style.display = "block";
  });

  // The artwork and title arrive over the socket, separately from the audio.
  // They are only rendered once sound is actually flowing, so a phone turned
  // over early shows nothing worth reading.
  function reveal(track) {
    if (revealed || !track) return;
    revealed = true;
    elTitle.textContent = track.title || "";
    elArtist.textContent = track.artist || "";
    if (track.cover) elArt.src = track.cover; else elArt.style.display = "none";
    elHeld.style.display = "none";
    elNow.style.display = "flex";
    // 30 seconds is the length of a preview. The bar is cosmetic and does not
    // drive anything.
    var started = Date.now();
    setInterval(function () {
      var pct = Math.min(100, ((Date.now() - started) / 30000) * 100);
      elFill.style.width = pct + "%";
    }, 250);
  }

  var pendingTrack = null;
  function onState(state) {
    if (!state || state.mode !== "play") return;
    pendingTrack = state.track || null;
  }

  // Sound first, picture second -- and the picture waits for the SERVER to say
  // the bytes went out. The element's own clock is useless here: the trickled
  // silence advances currentTime exactly as real audio does, so it reads as
  // "playing" from the moment of the tap. An early picture on a phone turned
  // over by accident is the whole effect given away.
  function onPlaying() {
    if (!armed) return;
    reveal(pendingTrack);
  }

  if (room) {
    var socket = io({ transports: ["websocket", "polling"] });
    socket.on("connect", function () { socket.emit("yt:join", { room: room }); });
    // A reconnect has to re-join: the server tracks membership per socket and
    // a new socket is in no rooms.
    socket.io.on("reconnect", function () { socket.emit("yt:join", { room: room }); });
    socket.on("yt:state", onState);
    socket.on("yt:playing", onPlaying);

    // For a socket that never comes up at all -- a captive portal, a hostile
    // guest network. The AUDIO does not depend on this; only the artwork does.
    setInterval(function () {
      if (revealed) return;
      fetch("/api/yt/" + encodeURIComponent(room) + "/state", { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (d) { if (d && d.ok) onState(d.state); })
        .catch(function () {});
    }, 3000);
  }
</script>
</body>
</html>
