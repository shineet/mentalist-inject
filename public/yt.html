<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>YouTube</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #fff; color: #030303;
    font: 14px/1.4 Roboto, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; user-select: none; -webkit-user-select: none; }

  #bar { background: #212121; height: 48px; display: flex; align-items: center;
         padding: 0 12px; gap: 14px; }
  #mark { display: flex; align-items: center; gap: 5px; }
  #mark .box { width: 30px; height: 21px; background: #fff; border-radius: 4px;
               display: flex; align-items: center; justify-content: center; }
  #mark .box::after { content: ""; border-left: 8px solid #212121;
                      border-top: 5px solid transparent; border-bottom: 5px solid transparent;
                      margin-left: 2px; }
  #mark span { color: #fff; font-size: 17px; font-weight: 500; letter-spacing: -.4px; }
  .sp { flex: 1; }
  #bar svg { width: 21px; height: 21px; fill: #fff; opacity: .95; }

  #screen { position: relative; width: 100%; aspect-ratio: 16/9; background: #000;
            display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  #chrome { position: absolute; inset: 0; padding: 8px 10px; display: flex;
            align-items: flex-start; gap: 16px; }
  #chrome svg { width: 20px; height: 20px; fill: #fff; opacity: .82; }
  .ring { width: 46px; height: 46px; border-radius: 50%; border: 3px solid transparent;
          border-top-color: #fff; border-right-color: #fff; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #pp { display: none; width: 60px; height: 60px; border-radius: 50%; background: rgba(0,0,0,.5);
        align-items: center; justify-content: center; z-index: 3; }
  #pp.paused::after { content: ""; border-left: 19px solid #fff; border-top: 12px solid transparent;
                      border-bottom: 12px solid transparent; margin-left: 5px; }
  #pp.playing::after { content: ""; width: 16px; height: 19px;
                       border-left: 5px solid #fff; border-right: 5px solid #fff; }
  #seek { position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
          background: rgba(255,255,255,.3); display: none; }
  #seek > i { display: block; height: 100%; width: 0; background: #f00; }

  #info { padding: 14px 14px 10px; }
  #ttl { font-size: 16px; line-height: 1.3; padding-right: 26px; position: relative; }
  #ttl::after { content: ""; position: absolute; right: 2px; top: 8px;
                border-top: 6px solid #606060; border-left: 6px solid transparent;
                border-right: 6px solid transparent; }
  #by { color: #606060; font-size: 13px; margin-top: 5px; }
  #acts { display: flex; align-items: center; gap: 7px; padding: 12px 14px 14px; }
  #acts svg { width: 19px; height: 19px; fill: #606060; }
  #acts b { font-weight: 400; color: #606060; font-size: 12px; margin-right: 14px; }
  hr { border: 0; border-top: 1px solid #e5e5e5; margin: 0; }

  .rel { display: flex; gap: 10px; padding: 10px 14px; align-items: flex-start; }
  .th { width: 142px; height: 80px; border-radius: 2px; position: relative; flex: 0 0 auto;
        background: linear-gradient(135deg, #2f2f2f, #101010 55%, #3a3a3a); }
  .th i { position: absolute; right: 4px; bottom: 4px; background: rgba(0,0,0,.8); color: #fff;
          font-size: 11px; padding: 1px 4px; border-radius: 2px; font-style: normal; }
  .rt { font-size: 14px; line-height: 1.3; }
  .rc { color: #606060; font-size: 12px; margin-top: 3px; }

  #choice { position: fixed; inset: 0; z-index: 12; background: #fff;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 26px; padding: 0 26px; }
  #glogo { font: 400 40px/1 "Product Sans", Roboto, -apple-system, system-ui, sans-serif;
           letter-spacing: -1px; margin-bottom: 6px; }
  #glogo span:nth-child(1) { color: #4285f4; }
  #glogo span:nth-child(2) { color: #ea4335; }
  #glogo span:nth-child(3) { color: #fbbc05; }
  #glogo span:nth-child(4) { color: #4285f4; }
  #glogo span:nth-child(5) { color: #34a853; }
  #glogo span:nth-child(6) { color: #ea4335; }
  .tile { width: 100%; max-width: 330px; padding: 22px; border-radius: 14px;
          background: #f1f3f4; display: flex; align-items: center; justify-content: center; }
  .ytmark { display: flex; align-items: center; gap: 6px; }
  .ytmark .box { width: 34px; height: 24px; background: #f00; border-radius: 5px;
                 display: flex; align-items: center; justify-content: center; }
  .ytmark .box::after { content: ""; border-left: 9px solid #fff; border-top: 6px solid transparent;
                        border-bottom: 6px solid transparent; margin-left: 2px; }
  .ytmark span { font-size: 21px; font-weight: 600; letter-spacing: -.5px; color: #030303; }
  /* A real button, and a long way down. It read as a caption on the tile above
     it, which is both unclickable-looking and, worse, close enough to hit by
     accident while reaching for the tile. Still grey and still quiet: it is the
     only thing on this page that would give the game away if a spectator read
     it. */
  #primelink { margin-top: 90px; color: #5f6368; font-size: 13px;
               padding: 11px 20px; border: 1px solid #dadce0; border-radius: 20px;
               background: #fff; }
  #primelink:active { background: #f1f3f4; }
  #primed { display: none; color: #188038; font-size: 12px; margin-top: -14px; }

  #bad { display: none; position: fixed; inset: 0; z-index: 20; background: #fff;
         align-items: center; justify-content: center; color: #606060;
         font-size: 13px; text-align: center; padding: 0 32px; }
</style>
</head>
<body>

<!-- iOS will not lock the screen while a video plays. NoSleep.js's trick, which
     the other product has had all along: a 2x2 silent clip loops out of sight. Starting it
     is media playback and so needs the tap, which is the other reason the tap on
     the cover exists. -->
<video id="awake" src="/awake.mp4" loop muted playsinline
       style="position:fixed;width:2px;height:2px;opacity:.01;pointer-events:none;left:0;top:0"></video>

<!-- The landing page, which copies the shape of the other product: a service picker rather than
     anything that looks like a magic app. Theirs is titled "Google" and offers
     YouTube and Wikipedia; a spectator glancing at it sees a search page.
     The priming entry is deliberately quiet for the same reason -- it is the
     one line here that would give the game away if it were read. -->
<div id="choice">
  <div id="glogo"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></div>
  <div id="tile" class="tile">
    <div class="ytmark"><div class="box"></div><span>YouTube</span></div>
  </div>
  <div id="primelink">Check this device</div>
  <div id="primed">Ready.</div>
</div>

<div id="bad">This link is missing its room. Ask for it again.</div>

<script>
  // The landing page, and nothing else. It picks between performing and
  // priming, and BOTH of its options navigate from inside the click handler --
  // which is the one arrangement that reaches the YouTube app every time.
  //
  // Performing used to happen on this same page, with the navigation fired by a
  // timer once the song arrived. That lands in Safari. the other product splits the two
  // across separate documents and reaches the app, so this does the same: the
  // tile navigates to /y/<room>/go from inside the tap, and that page is
  // therefore created by a user-initiated navigation.
  var m = location.pathname.match(/^\/[yp](?:\/([A-Za-z0-9_-]+))?\/?$/);
  var room = (m && m[1]) || "x";
  function $(id) { return document.getElementById(id); }
  if (!room) $("bad").style.display = "flex";

  var primeVideoId = "3LiztfE1X7E";   // replaced by the room if it names another
  var x = new XMLHttpRequest();
  x.open("GET", "/api/yt/" + encodeURIComponent(room) + "/state?r=" + Date.now(), true);
  x.onload = function () {
    try {
      var s = JSON.parse(x.responseText).state;
      if (s && s.primeVideoId && s.primeVideoId.length === 11) primeVideoId = s.primeVideoId;
    } catch (e) {}
  };
  x.send();

  $("tile").addEventListener("click", function () {
    top.location.replace("/y/" + encodeURIComponent(room) + "/go");
  });

  // Priming. This navigation IS the gesture, which is why it reaches the app
  // every time and why it can fix a phone that prefers Safari: one tap on
  // iOS's own banner afterwards and the preference is set for good.
  $("primelink").addEventListener("click", function (e) {
    e.stopPropagation();
    try { sessionStorage.setItem("primed", "1"); } catch (err) {}
    location.href = "/yt-go/" + encodeURIComponent(primeVideoId);
  });

  try {
    if (sessionStorage.getItem("primed") === "1") {
      $("primed").style.display = "block";
      sessionStorage.removeItem("primed");
    }
  } catch (err) {}
</script>
</body>
</html>
