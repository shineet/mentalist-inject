<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>School Show — Teacher Tribute</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
    font-family: Georgia, 'Times New Roman', serif;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 0 8vw;
  }
  /* Display-mode sizing — same Projector/Phone toggle pattern as preshow.html */
  :root {
    --head-min: 26px; --head-max: 54px; --head-vw: 5.2vw;
    --body-min: 16px; --body-max: 26px; --body-vw: 2.4vw;
  }
  body.mode-projector {
    --head-min: 36px; --head-max: 92px; --head-vw: 6.8vw;
    --body-min: 20px; --body-max: 34px; --body-vw: 2.8vw;
  }
  body.mode-phone {
    --head-min: 20px; --head-max: 32px; --head-vw: 6vw;
    --body-min: 13px; --body-max: 19px; --body-vw: 3vw;
  }
  .heading {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 1.1s ease, transform 1.1s ease;
    color: #ffd76a;
    font-size: clamp(var(--head-min), var(--head-vw), var(--head-max));
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1.25;
    white-space: pre-line;
  }
  .heading.show { opacity: 1; transform: translateY(0); }
  .body {
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 1.1s ease, transform 1.1s ease;
    color: #f5f0e6;
    font-size: clamp(var(--body-min), var(--body-vw), var(--body-max));
    font-weight: 400;
    line-height: 1.6;
    margin-top: 26px;
    white-space: pre-line;
    max-width: 46em;
  }
  .body.show { opacity: 1; transform: translateY(0); }
  .body strong { color: #ffd76a; font-weight: 700; }

  /* Setup screen — same music URL + display mode pattern as preshow.html */
  #startOverlay {
    position: fixed; inset: 0;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    cursor: auto;
    z-index: 10;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #startOverlay.hidden { display: none; }
  #setupPanel { width: 90%; max-width: 420px; text-align: center; }
  #setupPanel.hidden { display: none; }
  #setupPanel .setupTitle {
    color: #f5f0e6;
    font-family: Georgia, serif;
    font-size: 22px;
    margin-bottom: 28px;
  }
  #setupPanel label {
    display: block;
    color: #888;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: left;
    margin-bottom: 6px;
  }
  #musicUrl {
    width: 100%;
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    color: #f5f0e6;
    font-size: 14px;
    padding: 11px 12px;
    margin-bottom: 10px;
    outline: none;
  }
  #musicUrl:focus { border-color: #ffd76a; }
  #setupPanel label.checkboxRow {
    display: flex; align-items: center; gap: 8px;
    text-align: left; text-transform: none; letter-spacing: normal;
    color: #aaa; font-size: 13px; cursor: pointer;
    margin-bottom: 24px;
  }
  .checkboxRow input[type="checkbox"] {
    width: 16px; height: 16px;
    accent-color: #ffd76a;
    cursor: pointer;
    flex-shrink: 0;
  }
  #modeToggle { display: flex; gap: 8px; margin-bottom: 28px; }
  .modeBtn {
    flex: 1;
    background: #111;
    border: 1px solid #333;
    color: #999;
    border-radius: 8px;
    padding: 12px 8px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .modeBtn.active { background: #2a2308; border-color: #ffd76a; color: #ffd76a; }
  #beginBtn {
    width: 100%;
    background: #ffd76a;
    color: #1a1400;
    border: none;
    border-radius: 8px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.05em;
    cursor: pointer;
    margin-bottom: 14px;
  }
  #setupHint { color: #444; font-size: 11px; letter-spacing: 0.06em; }

  /* Final QR screen -- shown after the last slide instead of staying black */
  #qrStage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    text-align: center;
    opacity: 0;
    transition: opacity 1.4s ease;
    pointer-events: none;
  }
  #qrStage.show { opacity: 1; pointer-events: auto; }
  #qrCard {
    background: #fff;
    border-radius: 24px;
    padding: 22px;
    box-shadow: 0 0 60px rgba(255, 215, 106, 0.25);
    display: inline-grid;
    place-items: center;
  }
  #qrCaption {
    margin-top: 26px;
    color: #ffd76a;
    font-size: clamp(18px, 3vw, 30px);
    font-weight: 700;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>

<div id="startOverlay">
  <div id="setupPanel">
    <div class="setupTitle">School Show Setup</div>

    <label for="musicUrl">Music URL (optional)</label>
    <input type="text" id="musicUrl" placeholder="Paste a music URL" autocomplete="off" spellcheck="false" />
    <label class="checkboxRow" for="noMusic">
      <input type="checkbox" id="noMusic" checked />
      <span>No music, just the sequence</span>
    </label>

    <label>Display</label>
    <div id="modeToggle">
      <button type="button" class="modeBtn active" data-mode="projector">🖥 Projector / Big Screen</button>
      <button type="button" class="modeBtn" data-mode="phone">📱 Phone / Small Screen</button>
    </div>

    <button id="beginBtn">▶ Begin</button>
    <div id="setupHint">or press any remote/keyboard key to begin</div>
  </div>
</div>

<div id="stage">
  <div class="heading" id="headingLine"></div>
  <div class="body" id="bodyLine"></div>
</div>

<div id="qrStage">
  <div id="qrCard"><div id="qrTarget"></div></div>
  <div id="qrCaption">Scan to join the show</div>
</div>

<audio id="bgMusic" preload="auto" loop></audio>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
  // ── School Show / Teacher Tribute sequence ──────────────────────────────
  // Sibling to preshow.html -- same visual language (dark, serif, gold
  // accent), same setup screen (music URL / projector-phone mode toggle),
  // same two-step arm-then-start flow so the audience never sees the config
  // panel. Open full-screen (Cmd+Ctrl+F in most browsers); a remote/keyboard
  // press first arms it, a second press actually starts the sequence.
  //
  // Content is 9 fixed slides (heading + body, **word** renders gold/bold).
  // Ends on a hard black screen and stays there, same walk-on-cue convention
  // as preshow.html.

  const SLIDES = [
    {
      heading: "TODAY YOU SAW...",
      body: "✨ The impossible become possible.\n\n🤝 Strangers become teammates.\n\n💡 Ordinary people do extraordinary things."
    },
    {
      heading: "TEACHERS PLAY THE MOST\nINFLUENTIAL ROLE",
      body: "In every student...\n\nand in society itself."
    },
    {
      heading: "YOUR INFLUENCE\nSHAPES FUTURES",
      body: "Every word.\n\nEvery action.\n\nEvery day."
    },
    {
      heading: "WHEN YOU FEEL\nWHAT OTHERS FEEL",
      body: "That's empathy.\n\nSee your students...\n\n**deeply.**"
    },
    {
      heading: "TWO HEADS ARE\nBETTER THAN ONE",
      body: "Even strangers...\n\nworking together...\n\ncan accomplish\n\nthe impossible."
    },
    {
      heading: "SAY “NOT TODAY”\nTO FAILURE",
      body: "What looks like failure...\n\nmay simply be\n\n**success in progress.**"
    },
    {
      heading: "THE PAST\nIS GONE",
      body: "The future...\n\nhasn't arrived.\n\n**Today**\n\nis where change begins."
    },
    {
      heading: "YOU HAVE THE\nSUPERPOWER",
      body: "To shape\n\nthe next generation.\n\nUse it wisely."
    },
    {
      heading: "THANK YOU",
      body: "For believing.\n\nFor caring.\n\nFor making a difference...\n\nevery single day.\n\n❤️"
    }
  ];

  // Reading-time pacing: base hold + per-word time, generous enough for a
  // room to read comfortably out loud in their head, not rushed.
  const FADE_MS = 1100;
  const GAP_MS = 500; // black gap between slides
  const HOLD_BASE_MS = 2200;
  const HOLD_PER_WORD_MS = 320;

  function wordCount(s) {
    return s.replace(/\*\*/g, '').split(/\s+/).filter(Boolean).length;
  }
  function holdDurationFor(slide) {
    const words = wordCount(slide.heading) + wordCount(slide.body);
    return HOLD_BASE_MS + words * HOLD_PER_WORD_MS;
  }
  // ── QR ending -- shown after the last slide instead of staying black.
  // Room defaults to "SHINE" (Shine's regular live-show room) but can be
  // overridden per use with ?room=, same convention as host.html/audience.html.
  function getRoom() {
    const raw = (new URLSearchParams(location.search).get('room') || 'SHINE').trim();
    return raw.replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 40) || 'SHINE';
  }
  function getAudienceUrl() {
    const url = new URL(location.href);
    url.pathname = '/audience.html';
    url.search = '';
    url.searchParams.set('room', getRoom());
    return url.toString();
  }
  const qrStage = document.getElementById('qrStage');
  const qrTarget = document.getElementById('qrTarget');
  function showQrEnding() {
    if (!qrTarget || typeof QRCode === 'undefined') { qrStage?.classList.add('show'); return; }
    qrTarget.innerHTML = '';
    new QRCode(qrTarget, {
      text: getAudienceUrl(),
      width: 320,
      height: 320,
      correctLevel: QRCode.CorrectLevel.H,
    });
    qrStage.classList.add('show');
  }

  function renderBold(text) {
    return text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }

  const headingEl = document.getElementById('headingLine');
  const bodyEl = document.getElementById('bodyLine');
  const startOverlay = document.getElementById('startOverlay');
  const setupPanel = document.getElementById('setupPanel');
  const bgMusic = document.getElementById('bgMusic');
  const musicUrlInput = document.getElementById('musicUrl');
  const noMusicCheckbox = document.getElementById('noMusic');
  const modeButtons = document.querySelectorAll('.modeBtn');
  const beginBtn = document.getElementById('beginBtn');

  const musicParam = new URLSearchParams(location.search).get('music');
  if (musicParam) {
    musicUrlInput.value = musicParam;
    noMusicCheckbox.checked = false;
  }
  musicUrlInput.addEventListener('input', () => {
    if (musicUrlInput.value.trim()) noMusicCheckbox.checked = false;
  });

  const MUSIC_VOLUME = 0.5;
  bgMusic.volume = MUSIC_VOLUME;

  let selectedMode = 'projector';
  modeButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      selectedMode = btn.dataset.mode;
      modeButtons.forEach(b => b.classList.toggle('active', b === btn));
    });
  });

  function showSlide(slide, done) {
    headingEl.textContent = slide.heading;
    bodyEl.innerHTML = renderBold(slide.body);
    requestAnimationFrame(() => {
      headingEl.classList.add('show');
      bodyEl.classList.add('show');
    });
    const hold = holdDurationFor(slide);
    setTimeout(() => {
      headingEl.classList.remove('show');
      bodyEl.classList.remove('show');
      setTimeout(done, FADE_MS + GAP_MS);
    }, FADE_MS + hold);
  }

  function runSequence(i) {
    if (i >= SLIDES.length) { showQrEnding(); return; }
    showSlide(SLIDES[i], () => runSequence(i + 1));
  }

  function fadeOutMusic(ms) {
    const steps = 30;
    const stepMs = ms / steps;
    const startVol = bgMusic.volume;
    let i = 0;
    const iv = setInterval(() => {
      i++;
      bgMusic.volume = Math.max(0, startVol * (1 - i / steps));
      if (i >= steps) { clearInterval(iv); bgMusic.pause(); }
    }, stepMs);
  }

  let timers = [];
  let state = 'setup'; // 'setup' -> 'armed' -> 'running'

  function arm() {
    if (state !== 'setup') return;
    state = 'armed';

    document.body.classList.add('mode-' + selectedMode);
    const url = musicUrlInput.value.trim();
    if (!noMusicCheckbox.checked && url) bgMusic.src = url;

    setupPanel.classList.add('hidden');
    startOverlay.style.cursor = 'none';
  }

  function startSequence() {
    if (state !== 'armed') return;
    state = 'running';

    startOverlay.classList.add('hidden');
    if (bgMusic.src) {
      bgMusic.currentTime = 0;
      bgMusic.play().catch(() => {});
      // Fade the music out well before the last slide's tribute lands, so
      // "THANK YOU" plays in near-silence rather than under a loop cut.
      const totalMs = SLIDES.reduce((sum, s) => sum + FADE_MS + holdDurationFor(s) + FADE_MS + GAP_MS, 0);
      timers.push(setTimeout(() => fadeOutMusic(2500), Math.max(0, totalMs - 6000)));
    }
    runSequence(0);
  }

  beginBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    arm();
  });

  musicUrlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') arm();
  });

  window.addEventListener('keydown', (e) => {
    if (document.activeElement === musicUrlInput) return;
    if (document.activeElement === noMusicCheckbox) return;
    if (state === 'setup') arm();
    else if (state === 'armed') startSequence();
  });

  startOverlay.addEventListener('click', () => {
    if (state === 'armed') startSequence();
  });
</script>

</body>
</html>
